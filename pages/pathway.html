<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:'Noto Sans SC',sans-serif;background:#07070d;color:#e8e4dc;min-height:100vh;overflow-x:hidden}
#noise-layer{pointer-events:none;position:fixed;inset:0;mix-blend-mode:difference;opacity:0.065;z-index:101}
#invert-layer{pointer-events:none;position:fixed;inset:0;background:color-mix(in srgb,#fff 100%,transparent);mix-blend-mode:difference;z-index:100}
#glow{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at 0% 0%,rgba(255,189,56,0) 40%,rgba(255,189,56,0.40) 100%);mix-blend-mode:screen;opacity:0.15;z-index:99}
#glow2{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at 100% 100%,rgba(180,120,50,0) 30%,rgba(180,120,50,0.35) 100%);mix-blend-mode:screen;opacity:0.12;z-index:98}
#vn{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.65) 100%);z-index:96}
#dots{pointer-events:none;position:fixed;inset:0;background-image:radial-gradient(rgba(255,215,0,0.025) 1px,transparent 1px);background-size:28px 28px;z-index:0}
main{position:relative;z-index:2;max-width:1600px;margin:0 auto;padding:2rem}
a{color:#e8e4dc;text-decoration:none}
.logo-text{font-weight:900;font-size:2.625rem;line-height:1;letter-spacing:0.0525rem;mix-blend-mode:plus-lighter;display:block;transition:text-shadow 0.3s}
.logo-text:hover{text-shadow:0 0 30px rgba(255,215,0,0.2)}
.nav-link{font-family:'Noto Serif SC',serif;font-size:0.85rem;letter-spacing:0.2rem;color:#e8e4dc;text-decoration:none;text-transform:uppercase;position:relative;transition:all 0.3s;opacity:0.55}
.nav-link::after{content:'';position:absolute;bottom:-2px;left:50%;width:0;height:1px;background:#FFD700;transition:all 0.3s}
.nav-link:hover{opacity:1}
.nav-link:hover::after{left:0;width:100%}

/* Detail layout */
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:0;border-left:1px solid rgba(255,215,0,0.06);border-right:1px solid rgba(255,215,0,0.06)}
.gc{border-right:1px solid rgba(255,215,0,0.06);border-bottom:1px solid rgba(255,215,0,0.06);padding:1rem}
.gc:last-child{border-right:none}
@keyframes fsi{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3rem 1rem 2.5rem;gap:1rem;position:relative}
.hero::before{content:'';position:absolute;top:-20%;left:-10%;right:-10%;bottom:-20%;background:radial-gradient(ellipse at 50% 30%,rgba(255,215,0,0.03) 0%,transparent 60%);animation:hp 4s ease-in-out infinite;pointer-events:none;z-index:-1}
@keyframes hp{0%,100%{opacity:0.5;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.hero-sub{font-family:'Noto Serif SC',serif;font-size:0.75rem;letter-spacing:0.35rem;opacity:0.5;text-transform:uppercase;font-weight:300}
.hero-title{font-weight:900;font-size:clamp(2.5rem,6vw,4.5rem);line-height:1.06;letter-spacing:0.04em;mix-blend-mode:plus-lighter}
.hero-title .sub{display:block;margin-top:0.1em;font-size:0.5em;font-weight:300;opacity:0.2;letter-spacing:0.15em}

/* Info grid */
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid rgba(255,215,0,0.06)}
.info-item{padding:1rem;border-right:1px solid rgba(255,215,0,0.06);border-bottom:1px solid rgba(255,215,0,0.06)}
.info-item:nth-child(3n){border-right:none}
.info-label{font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:rgba(255,215,0,0.3);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.3rem}
.info-value{font-size:0.9rem;color:rgba(232,228,220,0.7);line-height:1.5}

/* Seq path */
.seq-path{display:flex;flex-wrap:wrap;gap:0.3rem;padding:1rem 0}
.seq-item{padding:0.35rem 0.7rem;background:rgba(255,215,0,0.02);border:1px solid rgba(255,215,0,0.06);font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:rgba(232,228,220,0.4);letter-spacing:0.05em;transition:all 0.3s}
.seq-item:hover{color:#FFD700;border-color:rgba(255,215,0,0.2);background:rgba(255,215,0,0.04)}
.seq-item.end{color:rgba(255,215,0,0.7);border-color:rgba(255,215,0,0.15)}

/* Desc */
.desc-box{padding:1.5rem;background:rgba(255,215,0,0.01);border-left:3px solid rgba(255,215,0,0.12);margin:1rem 0;font-size:0.85rem;line-height:2;color:rgba(232,228,220,0.5);text-transform:none}

/* Section */
.section-title{font-size:1.2rem;font-weight:700;mix-blend-mode:plus-lighter;margin-bottom:0.8rem;letter-spacing:0.05em}
.ability-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid rgba(255,215,0,0.06)}
.ability-item{padding:0.8rem;border-right:1px solid rgba(255,215,0,0.06);border-bottom:1px solid rgba(255,215,0,0.06)}
.ability-item:nth-child(2n){border-right:none}
.ability-seq{font-family:'JetBrains Mono',monospace;font-size:0.5rem;color:#FFD700;letter-spacing:0.1em}
.ability-name{font-size:0.8rem;font-weight:600;margin:0.15rem 0}
.ability-desc{font-size:0.7rem;color:rgba(232,228,220,0.4);line-height:1.5;text-transform:none}

/* Characters */
.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid rgba(255,215,0,0.06)}
.char-item{padding:1rem;border-right:1px solid rgba(255,215,0,0.06);border-bottom:1px solid rgba(255,215,0,0.06);transition:all 0.3s}
.char-item:nth-child(3n){border-right:none}
.char-item:hover{background:rgba(255,215,0,0.01)}
.char-name{font-size:0.85rem;font-weight:600;mix-blend-mode:plus-lighter;transition:color 0.3s}
.char-item:hover .char-name{color:#FFD700}
.char-title{font-size:0.65rem;color:rgba(255,215,0,0.3);font-family:'JetBrains Mono',monospace;letter-spacing:0.1em;margin-top:0.1rem}
.char-bio{font-size:0.7rem;color:rgba(232,228,220,0.35);line-height:1.5;margin-top:0.3rem;text-transform:none}

/* Nav */
nav{display:flex;align-items:center;justify-content:space-between;padding:0 0 1rem;border-bottom:1px solid rgba(255,215,0,0.08);margin-bottom:1.5rem}

@media(max-width:768px){
  .info-grid,.ability-grid{grid-template-columns:1fr}
  .info-item:nth-child(2n){border-right:1px solid rgba(255,215,0,0.06)}
  .info-item:nth-child(3n){border-right:1px solid rgba(255,215,0,0.06)}
  .char-grid{grid-template-columns:1fr}
  .char-item:nth-child(3n){border-right:1px solid rgba(255,215,0,0.06)}
  main{padding:1rem}
}
</style>

<script>
function initCanvas(id){const c=document.getElementById(id);if(!c)return;const ctx=c.getContext('2d');function r(){c.width=window.innerWidth;c.height=window.innerHeight}r();window.addEventListener('resize',r);return{c,ctx,r}}
initCanvas('noise-layer');setInterval(()=>{const c=document.getElementById('noise-layer');if(!c)return;const w=c.width,h=c.height,id=c.getContext('2d').createImageData(w,h),b=id.data;for(let i=0;i<b.length;i+=4){const v=Math.random()*255;b[i]=v;b[i+1]=v;b[i+2]=v;b[i+3]=255}c.getContext('2d').putImageData(id,0,0)},100);
initCanvas('tex-c');(function(){const c=document.getElementById('tex-c');if(!c)return;const ctx=c.getContext('2d'),w=c.width,h=c.height;const id=ctx.createImageData(w,h),b=id.data;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,p=(Math.sin(x*0.05)+Math.sin(y*0.05))*15+128,n=Math.random()*8-4;b[i]=p+n;b[i+1]=p*0.8+n;b[i+2]=p*0.5+n;b[i+3]=15}ctx.putImageData(id,0,0)})();
initCanvas('grain-c');setInterval(()=>{const c=document.getElementById('grain-c');if(!c)return;const w=c.width,h=c.height,id=c.getContext('2d').createImageData(w,h),b=id.data;for(let i=0;i<b.length;i+=4){b[i]=Math.random()*40+10;b[i+1]=b[i]*0.9;b[i+2]=b[i]*0.7;b[i+3]=25}c.getContext('2d').putImageData(id,0,0)},200);
const ptc=document.getElementById('pt-c'),ptctx=ptc.getContext('2d');let pw=0,ph=0,pts=[];function pr(){pw=ptc.width=window.innerWidth;ph=ptc.height=window.innerHeight;pts=[];for(let i=0;i<80;i++)pts.push({x:Math.random()*pw,y:Math.random()*ph,vx:(Math.random()-0.5)*0.25,vy:(Math.random()-0.5)*0.25,s:Math.random()*1.8+0.3,a:Math.random()*0.35+0.08})}pr();window.addEventListener('resize',pr);(function dp(){ptctx.clearRect(0,0,pw,ph);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=pw;if(p.x>pw)p.x=0;if(p.y<0)p.y=ph;if(p.y>ph)p.y=0;ptctx.beginPath();ptctx.arc(p.x,p.y,p.s,0,Math.PI*2);ptctx.fillStyle=`rgba(255,215,0,${p.a})`;ptctx.fill()}requestAnimationFrame(dp)})();
</script>

  {n:'女皇',c:'刺客',h:'魔女',s:'毒药·女巫·魅惑',a:'特莉丝',d:'刺客途径，代表了最初造物主的阴性领域。序列7"女巫"时会发生性别转换，男性转为女性，是这条途径最著名的特征。掌握毒药、魅惑与厄运之力。特莉丝为该途径的代表人物，经历了从序列7到序列4的晋升。',q:'刺客→教唆者→女巫→欢愉魔女→痛苦魔女→绝望魔女→不老魔女→末日魔女→灾难魔女→魔女',m:'蛇发女妖',u:'一尊白骨制成般的女人雕像',j:'红祭司途径（半神后可转）',y:'灾祸之城',g:'毁灭天灾、根源之祸'},

  {n:'教皇',c:'水手',h:'暴君',s:'风暴·海洋·雷霆',a:'阿尔杰·威尔逊',d:'水手途径，代表"全知全能"中的物质领域，对应"风暴"权柄。该途径非凡者比较暴躁，容易暴怒且不考虑大局，面对高位者时本能服从。阿尔杰·威尔逊为塔罗会「教皇」，从海上冒险家成长为半神，游历七海见识广博。',q:'水手→航海家→风眷者→海洋歌者→灾难主祭→海王→天灾→天气术师→雷神→暴君',m:'海怪（环绕闪电的巨型章鱼状生物）',u:'环绕闪电包裹的风暴',j:'空想家、倒吊人、太阳、白塔途径',y:'混沌海',g:'上帝、创造者、造物主、全知全能者、星界之主'},
  {n:'恋人',c:'偷盗者',h:'错误',s:'窃取·寄生·时之虫',a:'阿蒙',d:'偷盗者途径，诡秘三途径之一。权柄涵盖窃取、寄生与时间之虫。阿蒙为远古太阳神之子，与克莱恩争夺源堡的宿命对手。戴着标志性的尖顶软帽，喜欢以单片眼镜作为标志物。善于布局，以窃取他人命运和能力为乐。',q:'偷盗者→诈骗师→解密学者→寄生者→窃梦家→盗火者→时之虫→命运木马→错误道人→错误',m:'时之虫',u:'仿若水晶磨成的单片眼镜（后改为漆黑手套）',j:'愚者途径、门途径',y:'源堡',g:'诡秘之主、时空之王、命运道标、源堡化身、灵界支配者'},
  {n:'战车',c:'猎人',h:'红祭司',s:'火焰·战争·征服',a:'索伦/梅迪奇',d:'猎人途径，战争与纯粹阳性的化身。不需要透彻理解原理，只考虑怎么使用。成为半神前不太擅长通灵与催眠，获取情报主要靠拷问和威胁。索伦·艾因霍恩·梅迪奇是远古太阳神座下天使之王，掌握战争与火焰权柄。',q:'猎人→挑衅者→收割者→阴谋家→灵魂收割者→战争主教→铁血骑士→征服者→陨落者→红祭司',m:'灾祸巨人（火焰巨人）',u:'一面被烧焦的旗帜，旗杆铁黑色，旗面有大量血点',j:'魔女途径（半神后可转）',y:'灾祸之城',g:'毁灭天灾、根源之祸'},
  {n:'力量',c:'战士',h:'黄昏巨人',s:'战斗·黎明·守护',a:'科林·伊利亚特',d:'战士途径，因对应真神为"战神"而被称为战神途径。序列0「黄昏巨人」代表黄昏时分的守护力量。科林·伊利亚特为白银城首席，持「黄昏」之剑在神弃之地对抗黑暗，守护白银城民众。',q:'战士→格斗家→武器大师→黎明骑士→守护者→猎魔人→银骑士→荣耀者→神明之手→黄昏巨人',m:'独眼巨人',u:'一把散发着橘红光芒的夸张巨剑',j:'黑暗途径、死神途径',y:'永暗之河',g:'永恒之暗、万物奇点、时空归一者'},
  {n:'隐者',c:'窥秘人',h:'隐者',s:'神秘·召唤·预言',a:'嘉德丽雅',d:'窥秘人途径，偏向神秘侧的知识本身。嘉德丽雅为塔罗会「隐者」，强大的预言家，拥有罗塞尔后裔的重要线索。此途径掌握神秘学知识与召唤能力。',q:'窥秘人→巫师→卷轴教授→星象师→召唤大师→神秘学家→预言大师→贤者→知识导师→隐者',m:'知识妖精',u:'一只没有睫毛的、淡漠无情的虚幻眼睛',j:'完美者途径',y:'知识荒野',g:'知识之妖、疯狂奥秘'},
  {n:'命运之轮',c:'怪物',h:'命运之轮',s:'幸运·概率·混乱',a:'威尔·昂赛汀',d:'怪物途径，简称"命运"途径。能看见其他途径难以看到之物。高序列以下几乎无战斗能力，全靠直觉预感和命运眷顾生存。无相邻途径。威尔·昂赛汀为命运之蛇（水银之蛇），掌控厄运与好运的平衡，曾多次在关键时刻帮助克莱恩。',q:'怪物→折翼天使→幸运者→厄运法师→熵之法师→狂乱法师→命运先知→秩序阴影→天命→命运之轮',m:'衔尾蛇（水银巨蛇）',u:'一枚乳白色的骰子',j:'无相邻途径',y:'光之钥',g:'光之钥、无尽的混乱、命运的化身'},
  {n:'正义',c:'观众',h:'空想家',s:'读心·催眠·梦境',a:'奥黛丽·霍尔',d:'观众途径，对应"全知全能"中的心灵领域。掌握读心、催眠、梦境操控之力，高序列可"空想"将虚幻化为现实。奥黛丽·霍尔为塔罗会第一位成员「正义」，霍尔伯爵千金。善良勇敢、求知欲旺盛，最年轻的半神之一。',q:'观众→读心者→心理医生→催眠师→梦境行者→秘法师→洞察者→操纵师→编织者→空想家',m:'心灵巨龙（灰白色、有淡金竖瞳）',u:'一团由大脑与心灵构成的虚幻灰白事物',j:'倒吊人、太阳、暴君、白塔途径',y:'混沌海',g:'上帝、创造者、造物主、全知全能者、星界之主'},
  {n:'倒吊人',c:'秘祈人',h:'倒吊人',s:'低语·献祭·隐秘',a:'真实造物主',d:'秘祈人途径，代表"全知全能"的全能领域，掌握"堕落"与"牺牲"权柄。真实造物主为隐秘存在，与亚当融合后复苏为远古太阳神。此途径非凡者聆听低语，获得禁忌知识，但也易受污染与疯狂。',q:'秘祈人→倾听者→隐修士→米粒拉之影→秘术导师→神秘学家→召唤大师→先知→圣母→倒吊人',m:'黑色阴影与蠕动的血肉',u:'一道浓郁黝黑的阴影',j:'空想家、太阳、暴君、白塔途径',y:'混沌海',g:'上帝、创造者、造物主、全知全能者、星界之主'},
  {n:'死神',c:'收尸人',h:'死神',s:'灵魂·亡灵·冥界',a:'阿兹克·艾格斯',d:'收尸人途径，拥有强大灵性。远古死神为不死鸟始祖格蕾嘉莉，故第三纪前称"不死鸟"途径。掌握灵魂、亡灵与死亡权柄。阿兹克·艾格斯为死神途径高序列强者，克莱恩的历史老师与好友，多次在关键时刻出手相助。',q:'收尸人→掘墓人→亡语者→看门人→收割者→不死者→摆渡人→死亡执政官→凋零君王→死神',m:'羽蛇',u:'一本由羽蛇盘旋而成的虚幻书册',j:'黑暗途径、黄昏巨人途径',y:'永暗之河',g:'永恒之暗、万物奇点、时空归一者'},
  {n:'节制',c:'囚犯',h:'被缚者',s:'疯狂·诅咒·枷锁',a:'莎伦',d:'囚犯途径，又称"异种"途径。因非凡特性带来的负面影响而化成怪物，心里潜藏嗜血欲望。从序列8开始出现诅咒。本途径分为放纵派与节制派——放纵派沉沦欲望，节制派以钢铁意志对抗疯狂。莎伦为节制派代表人物，以极强的意志力对抗诅咒与疯狂。',q:'囚犯→疯子→狼人→活尸→怨魂→木偶→沉默门徒→古代邪物→神孽→被缚者',m:'无形的诅咒集合体',u:'被绷带、荆棘和玫瑰层层缠绕的虚幻小人',j:'深渊途径',y:'暗影世界',g:'恶魔之父、异类之主、诅咒之源'},
  {n:'恶魔',c:'罪犯',h:'深渊',s:'暴力·恶魔·深渊',a:'欲望母树',d:'罪犯途径，代表张扬的恶意。源自外神"欲望母树"的序列途径，是最凶险的序列之一。掌握暴力、恶魔与毁灭之力。途径非凡者易受欲望母树影响，逐步堕入深渊。',q:'罪犯→冷血者→连环杀手→恶魔→欲望使徒→魔鬼→呓语者→鲜血大公→污秽君王→深渊',m:'深渊恶魔形态',u:'深邃黑暗的深渊入口般的物品',j:'被缚者途径',y:'暗影世界',g:'恶魔之父、异类之主、诅咒之源'},
  {n:'塔',c:'阅读者',h:'白塔',s:'知识·发明·推理',a:'艾德雯娜·爱德华兹',d:'阅读者途径，代表"全知全能"的全知领域。掌握知识、推理与预言权柄。此途径非凡者善于收集信息、推理分析，高序列可获得预见未来的能力。艾德雯娜·爱德华兹为「黄金梦想号」船长，知识与智慧之神的教会成员。',q:'阅读者→推理学员→守知者→博学者→秘术导师→预言家→贤者→全知之眼→天师→白塔',m:'书籍组成的塔',u:'无数虚幻书籍组成的白塔',j:'空想家、倒吊人、暴君、太阳途径',y:'混沌海',g:'上帝、创造者、造物主、全知全能者、星界之主'},
  {n:'星星',c:'不眠者',h:'黑暗',s:'黑夜·梦境·寂静',a:'伦纳德·米切尔',d:'不眠者途径，因对应真神"黑夜女神"而称"黑夜"途径。序列6前缺乏辅助能力，灵视浅淡，占卜效果不佳。伦纳德·米切尔为塔罗会「星星」，值夜者红手套队长。体内寄宿古老者帕列斯·索罗亚斯德（错误途径序列1），兼具诗人气质与幽默风趣。',q:'不眠者→午夜诗人→梦魇→守夜人→收割者→不死者→摆渡人→沉默术士→恐惧之主→黑暗',m:'四足魔狼',u:'一柄漆黑如夜的异形巨镰',j:'死神途径、黄昏巨人途径',y:'永暗之河',g:'永恒之暗、万物奇点、时空归一者'},
  {n:'月亮',c:'药师',h:'月亮',s:'魔药·吸血鬼·生命',a:'埃姆林·怀特',d:'药师途径，纯阴性途径。代表着灵性、植物、美丽、部分生命与部分黑暗。序列7"吸血鬼"为该途径标志性节点，非凡者成为血族并获得相关能力。埃姆林·怀特为塔罗会「月亮」，血族成员，性格傲娇自大但重情义，在塔罗会中逐步成长。',q:'药师→驯兽师→吸血鬼→男爵→子爵→伯爵→侯爵→公爵→血族始祖→月亮',m:'背负虚幻红月的人形生物',u:'一轮微缩的虚幻红月',j:'母亲途径',y:'母巢',g:'根源之神、万物之母、污秽的母巢'},
  {n:'太阳',c:'歌颂者',h:'太阳',s:'光明·黎明·净化',a:'戴里克·伯格',d:'歌颂者途径，代表灿烂的金色与光明之力。掌握光明、黎明与净化权柄，是克制黑暗与亡灵的最佳途径。戴里克·伯格为塔罗会「太阳」，来自神弃之地白银城的虔诚少年。在愚者的指引下逐步晋升，是愚者最忠实的信徒之一。',q:'歌颂者→祈光人→光之祭司→太阳神官→无暗者→光之天使→逐光者→银骑士→神明之手→太阳',m:'太阳鸟（燃烧金色火焰）',u:'一轮微缩浓烈的炽热太阳',j:'空想家、暴君、倒吊人、白塔途径',y:'混沌海',g:'上帝、创造者、造物主、全知全能者、星界之主'},
  {n:'审判',c:'仲裁人',h:'审判者',s:'律法·秩序·裁决',a:'休·迪尔查',d:'仲裁人途径，代表着秩序与规则。正是因为此途径的存在，这个世界军队发展轨迹才会和地球贴近。休·迪尔查为塔罗会「审判」，贝克兰德律法体系的守护者。出身军情九处，身材矮小但战斗力极强。',q:'仲裁人→调解人→治安官→法官→惩戒骑士→裁决者→律令法师→秩序之手→平衡者→审判者',m:'黄铜巨柱',u:'一本黄铜铸就的轻薄书册',j:'黑皇帝途径',y:'失序之国',g:'失序者、秩序阴影'},

<script>
gsap.registerPlugin(ScrollTrigger);
