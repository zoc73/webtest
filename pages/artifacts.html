<script>
function initCanvas(id){const c=document.getElementById(id);if(!c)return;const ctx=c.getContext('2d');function r(){c.width=window.innerWidth;c.height=window.innerHeight}r();window.addEventListener('resize',r);return{c,ctx,r}}
initCanvas('noise-layer');setInterval(()=>{const c=document.getElementById('noise-layer');if(!c)return;const w=c.width,h=c.height,id=c.getContext('2d').createImageData(w,h),b=id.data;for(let i=0;i<b.length;i+=4){const v=Math.random()*255;b[i]=v;b[i+1]=v;b[i+2]=v;b[i+3]=255}c.getContext('2d').putImageData(id,0,0)},100);
initCanvas('tex-c');(function(){const c=document.getElementById('tex-c');if(!c)return;const ctx=c.getContext('2d'),w=c.width,h=c.height;const id=ctx.createImageData(w,h),b=id.data;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,p=(Math.sin(x*0.05)+Math.sin(y*0.05))*15+128,n=Math.random()*8-4;b[i]=p+n;b[i+1]=p*0.8+n;b[i+2]=p*0.5+n;b[i+3]=15}ctx.putImageData(id,0,0)})();

var curFilter = 'all';
function renderArts(filter){
  curFilter = filter;
  var html = '';
  var filtered = filter === 'all' ? ART_DATA : ART_DATA.filter(function(a){return a.c === filter});
  filtered.forEach(function(a, i){
    var delay = (i % 6) + 1;
    html += '<div class="ic fade fd' + delay + '" onclick="location.href=\'artifact.html?name=' + encodeURIComponent(a.n) + '\'" style="cursor:pointer"><h4>◈ ' + a.n + '</h4><span class="lv">' + a.t + '</span><p>' + a.d + '</p></div>';
  });
  document.getElementById('artGrid').innerHTML = html;
  // Re-run intersection observer for new fade elements
  setTimeout(function(){
    var ob = new IntersectionObserver(function(e){e.forEach(function(e){if(e.isIntersecting&&e.target.style.animationPlayState!=='running')e.target.style.animationPlayState='running'})},{threshold:0.08});
    document.querySelectorAll('#artGrid .fade').forEach(function(e){e.style.animationPlayState='paused';ob.observe(e)});
  }, 50);
}
function sw(btn, id){
  document.querySelectorAll('.tbn').forEach(function(b){b.classList.remove('act')});
  btn.classList.add('act');
  renderArts(id);
}
