<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>非凡途径 — 诡秘之主</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:#07070d;color:#e8e4dc;height:3000vh;overflow-x:hidden}
#inv{position:fixed;inset:0;pointer-events:none;background:color-mix(in srgb,#fff 100%,transparent);mix-blend-mode:difference;z-index:100}
#gl1{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 0% 0%,rgba(255,189,56,0) 40%,rgba(255,189,56,0.40) 100%);mix-blend-mode:screen;opacity:0.15;z-index:99}
#gl2{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 100% 100%,rgba(180,120,50,0) 30%,rgba(180,120,50,0.35) 100%);mix-blend-mode:screen;opacity:0.12;z-index:98}
#vn{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.6) 100%);z-index:96}
#dots{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,215,0,0.025) 1px,transparent 1px);background-size:28px 28px;z-index:0}
canvas{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
#nc{mix-blend-mode:difference;opacity:0.065;z-index:101}
#gc{mix-blend-mode:overlay;opacity:0.04;z-index:98}
#pc{z-index:95;opacity:0.45}
nav{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:rgba(7,7,13,0.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,215,0,0.06)}
nav a{font-family:'JetBrains Mono',monospace;font-size:0.65rem;letter-spacing:0.12rem;color:rgba(232,228,220,0.35);text-decoration:none;text-transform:uppercase;transition:color 0.2s}
nav a:hover{color:#FFD700}
nav .brand{font-weight:900;font-size:1rem;letter-spacing:-0.02em;mix-blend-mode:plus-lighter;color:#e8e4dc;text-decoration:none}
.title{position:fixed;bottom:12vh;left:50%;transform:translateX(-50%);z-index:89;text-align:center;pointer-events:none}
.title h2{font-size:1.1rem;font-weight:700;letter-spacing:0.1em;mix-blend-mode:plus-lighter;color:#FFD700;opacity:0.5}
.title p{font-size:0.65rem;opacity:0.2;font-family:JetBrains Mono,monospace;margin-top:0.3rem;letter-spacing:0.1em}
#wrap{position:fixed;left:50%;z-index:2}
.card{position:absolute;border-radius:10px;cursor:pointer;transition:opacity 0.15s}
.card:hover{filter:brightness(1.3)!important;opacity:1!important;z-index:999!important}
.ci{width:100%;height:100%;background:linear-gradient(180deg,#0c0c18,#07070d);border:1px solid rgba(255,215,0,0.12);border-radius:10px;padding:0.6rem;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(0,0,0,0.4);position:relative}
.ci::before{content:'';position:absolute;inset:0;border-radius:9px;border:1px solid rgba(255,215,0,0.05)}
.ci .cn{font-family:JetBrains Mono,monospace;font-size:0.6rem;color:rgba(255,215,0,0.3)}
.ci .nm{font-size:0.75rem;font-weight:700;letter-spacing:0.12em;mix-blend-mode:plus-lighter;text-align:center;color:#e8e4dc}
.ci .dv{width:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,215,0,0.1),transparent);margin:0.15rem 0}
.ci .pt{font-family:JetBrains Mono,monospace;font-size:0.5rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,215,0,0.3);text-align:center}
.ci .ds{font-size:0.5rem;color:rgba(232,228,220,0.22);text-align:center;line-height:1.4}
</style>
</head>
<body>
<div id="inv"></div><div id="gl1"></div><div id="gl2"></div><div id="vn"></div><div id="dots"></div>
<canvas id="nc"></canvas><canvas id="gc"></canvas><canvas id="pc"></canvas>
<nav>
  <a href="../index.html" class="brand">诡秘之主</a>
  <div style="display:flex;gap:1.5rem">
    <a href="../index.html">首页</a>
    <a href="characters.html">角色</a>
    <a href="pathways.html" style="color:#e8e4dc">途径</a>
    <a href="artifacts.html">封印物</a>
  </div>
</nav>
<div class="title"><h2>22 条非凡途径</h2><p>Scroll to explore</p></div>
<div id="wrap"></div>
<script>
var D = [
  ['0','愚者','占卜家','占卜·秘偶·时之虫','克莱恩'],
  ['I','魔法师','偷盗者','窃取·寄生·时之虫','阿蒙'],
  ['XXI','世界','学徒','传送·空间·门','诡秘三途径'],
  ['VIII','正义','观众','读心·催眠·梦境','奥黛丽'],
  ['XI','力量','战士','战斗·黎明·守护','守护之路'],
  ['XVIII','月亮','不眠者','黑夜·梦境·寂静','伦纳德'],
  ['XV','恶魔','秘祈人','低语·献祭·隐秘','禁忌之路'],
  ['VII','战车','水手','风暴·海洋·雷霆','阿尔杰'],
  ['V','教皇','通识者','知识·机械·蒸汽','蒸汽教会'],
  ['X','命运之轮','怪物','幸运·概率·混乱','命运宠儿'],
  ['III','女皇','药师','魔药·吸血鬼·生命','血族'],
  ['IV','皇帝','耕种者','自然·丰收·大地','生命途径'],
  ['XIII','死神','收尸人','灵魂·亡灵·冥界','死亡领域'],
  ['XX','审判','仲裁人','律法·秩序·裁决','正义之路'],
  ['IV','皇帝','律师','规则·阴谋·独裁','罗塞尔'],
  ['XVI','高塔','囚犯','疯狂·诅咒·枷锁','挣脱之路'],
  ['XII','倒吊人','猎人','火焰·战争·征服','红祭司'],
  ['II','女祭司','刺客','毒药·女巫·魅惑','暗影杀手'],
  ['IX','隐者','窥秘人','神秘·召唤·预言','求知之路'],
  ['XIX','太阳','太阳','光明·黎明·净化','戴里克'],
  ['XVII','星星','窥秘人','知识·发明·进步','科学之路'],
  ['VI','恋人','罪犯','暴力·恶魔·深渊','混沌之源']
];
var N = D.length;
var wrap = document.getElementById('wrap');
var cards = [];
var cw, ch, rd;

function setup() {
  wrap.innerHTML = '';
  cards = [];
  cw = Math.min(145, innerWidth * 0.18);
  ch = cw * 7 / 5;
  rd = cw * N / (2 * Math.PI);
  wrap.style.top = (innerHeight * 0.5 + rd + ch * 1.5) + 'px';
  for (var i = 0; i < N; i++) {
    var d = D[i];
    var el = document.createElement('div');
    el.className = 'card';
    el.style.width = cw + 'px';
    el.style.height = ch + 'px';
    el.innerHTML = '<div class="ci">' +
      '<span class="cn">' + d[0] + '</span>' +
      '<span class="nm">' + d[1] + '</span>' +
      '<div class="dv"></div>' +
      '<span class="pt">' + d[2] + '</span>' +
      '<span class="ds">' + d[3] + '<br>' + d[4] + '</span>' +
      '<span class="cn" style="align-self:flex-end">' + d[0] + '</span></div>';
    wrap.appendChild(el);
    cards.push(el);
  }
  update(0);
}

function update(angle) {
  var tw = rd * 2 + cw + 40;
  wrap.style.width = tw + 'px';
  wrap.style.transform = 'translateX(-50%) rotate(' + angle + 'rad)';
  var offsetX = (tw - cw) / 2;
  var offsetY = (rd * 2 + ch - rd * 2) / 2;
  for (var i = 0; i < N; i++) {
    var a = (i / N) * 2 * Math.PI - Math.PI / 2 + angle;
    var x = rd + rd * Math.cos(a) - cw / 2;
    var y = rd + rd * Math.sin(a) - ch / 2;
    var frontAngle = -Math.PI / 2 + angle;
    var diff = a - frontAngle;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    while (diff > Math.PI) diff -= 2 * Math.PI;
    var dist = Math.abs(diff) / Math.PI;
    var el = cards[i];
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.filter = 'blur(' + (dist * 5) + 'px) grayscale(' + dist + ')';
    el.style.opacity = Math.max(0.15, 1 - dist * 1.2);
    el.style.zIndex = Math.round((1 - dist) * 100);
  }
}

var ticking = false;
window.addEventListener('scroll', function() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(function() {
    var p = window.scrollY / (document.body.scrollHeight - window.innerHeight);
    if (p > 1) p = 1;
    if (p < 0) p = 0;
    update(p * 2 * Math.PI);
    ticking = false;
  });
}, {passive: true});

window.addEventListener('resize', setup);

// Canvas layers
(function(){
  function C(id) {
    var c = document.getElementById(id);
    if (!c) return null;
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    return c;
  }
  var nc = C('nc');
  if (nc) {
    setInterval(function() {
      var w = nc.width, h = nc.height;
      var d = nc.getContext('2d').createImageData(w, h);
      var b = d.data;
      for (var i = 0; i < b.length; i += 4) {
        var v = Math.random() * 255;
        b[i] = v; b[i+1] = v; b[i+2] = v; b[i+3] = 255;
      }
      nc.getContext('2d').putImageData(d, 0, 0);
    }, 100);
  }
  var gc = C('gc');
  if (gc) {
    setInterval(function() {
      var w = gc.width, h = gc.height;
      var d = gc.getContext('2d').createImageData(w, h);
      var b = d.data;
      for (var i = 0; i < b.length; i += 4) {
        b[i] = Math.random() * 40 + 10;
        b[i+1] = b[i] * 0.9;
        b[i+2] = b[i] * 0.7;
        b[i+3] = 25;
      }
      gc.getContext('2d').putImageData(d, 0, 0);
    }, 200);
  }
  var pc = C('pc');
  var pts = [];
  if (pc) {
    (function() {
      var w = pc.width, h = pc.height;
      for (var i = 0; i < 60; i++) {
        pts.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.2,
          s: Math.random() * 1.5 + 0.3,
          a: Math.random() * 0.3 + 0.05
        });
      }
    })();
    (function dp() {
      var w = pc.width, h = pc.height;
      var ctx = pc.getContext('2d');
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = w;
        if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h;
        if (p.y > h) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,215,0,' + p.a + ')';
        ctx.fill();
      }
      requestAnimationFrame(dp);
    })();
  }
})();

setup();
</script>
</body>
</html>
