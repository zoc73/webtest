<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>非凡途径 — 诡秘之主</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;600;700;900&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:'Noto Sans SC',sans-serif;background:#07070d;color:#e8e4dc;min-height:100vh;overflow:hidden;width:100vw;height:100vh}
#noise-layer{pointer-events:none;position:fixed;inset:0;mix-blend-mode:difference;opacity:0.065;z-index:101}
#glow{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at 0% 0%,rgba(255,189,56,0) 40%,rgba(255,189,56,0.40) 100%);mix-blend-mode:screen;opacity:0.15;z-index:99}
#glow2{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at 100% 100%,rgba(180,120,50,0) 30%,rgba(180,120,50,0.35) 100%);mix-blend-mode:screen;opacity:0.12;z-index:98}
#vn{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.65) 100%);z-index:96}
#dots{pointer-events:none;position:fixed;inset:0;background-image:radial-gradient(rgba(255,215,0,0.025) 1px,transparent 1px);background-size:28px 28px;z-index:0}
#grain-c{pointer-events:none;position:fixed;inset:0;mix-blend-mode:overlay;opacity:0.04;z-index:98}
#tex-c{pointer-events:none;position:fixed;inset:0;mix-blend-mode:color-dodge;opacity:0.025;z-index:97}
#pt-c{pointer-events:none;position:fixed;inset:0;z-index:95;opacity:0.45}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:linear-gradient(180deg,rgba(7,7,13,0.9),transparent)}
nav a{font-family:'Noto Serif SC',serif;font-size:0.85rem;letter-spacing:0.2rem;color:#e8e4dc;text-decoration:none;text-transform:uppercase;position:relative;transition:all 0.3s;opacity:0.55}
nav a:hover{opacity:1}
/* -------- 3D CAROUSEL -------- */
.scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px;z-index:1}
.carousel{position:relative;width:400px;height:560px;transform-style:preserve-3d;transition:transform 0.8s cubic-bezier(0.65,0,0.35,1)}
.card{position:absolute;width:400px;height:560px;left:0;top:0;backface-visibility:hidden;border:1px solid rgba(255,215,0,0.08);background:rgba(10,10,18,0.55);backdrop-filter:blur(12px);border-radius:6px;padding:2rem;display:flex;flex-direction:column;cursor:pointer;transition:all 0.4s;transform-style:preserve-3d;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,215,0,0.03),transparent);transition:left 0.6s}
.card:hover::before{left:100%}
.card:hover{border-color:rgba(255,215,0,0.2);box-shadow:0 0 40px rgba(255,215,0,0.06)}
.card::after{content:'';position:absolute;inset:0;border-radius:6px;border:1px solid transparent;transition:all 0.5s;pointer-events:none}
.card:hover::after{border-color:rgba(255,215,0,0.1);box-shadow:inset 0 0 30px rgba(255,215,0,0.03)}
/* Corner brackets */
.card-c{position:absolute;width:16px;height:16px;border-color:rgba(255,215,0,0.12);border-style:solid;transition:all 0.4s}
.card:hover .card-c{border-color:rgba(255,215,0,0.3)}
.card-c.tl{top:10px;left:10px;border-width:1px 0 0 1px}
.card-c.tr{top:10px;right:10px;border-width:1px 1px 0 0}
.card-c.bl{bottom:10px;left:10px;border-width:0 0 1px 1px}
.card-c.br{bottom:10px;right:10px;border-width:0 1px 1px 0}
.card-badge{font-family:'JetBrains Mono',monospace;font-size:0.5rem;letter-spacing:0.15em;color:rgba(255,215,0,0.3);text-transform:uppercase;margin-bottom:0.5rem}
.card-roman{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:rgba(255,215,0,0.15);margin-top:auto;letter-spacing:0.1em}
.card-title{font-weight:900;font-size:2.8rem;line-height:1.05;letter-spacing:-0.01em;mix-blend-mode:plus-lighter;margin:0.3rem 0 0.1rem;transition:color 0.3s}
.card:hover .card-title{color:#FFD700}
.card-sub{font-size:0.85rem;opacity:0.35;font-weight:300;letter-spacing:0.08em;font-family:'Noto Serif SC',serif}
.card-path{display:flex;gap:0.3rem;flex-wrap:wrap;margin:1rem 0 0.5rem}
.card-path span{font-family:'JetBrains Mono',monospace;font-size:0.55rem;padding:0.15rem 0.5rem;background:rgba(255,215,0,0.03);border:1px solid rgba(255,215,0,0.06);color:rgba(232,228,220,0.4);letter-spacing:0.05em}
.card-desc{font-size:0.75rem;opacity:0.35;line-height:1.6;margin-top:0.3rem;font-weight:300;flex:1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card-source{margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid rgba(255,215,0,0.06);display:flex;align-items:center;gap:0.5rem}
.source-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.source-label{font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:rgba(255,215,0,0.25);letter-spacing:0.1em}
/* Navigation arrows */
.arrow{position:fixed;top:50%;z-index:40;transform:translateY(-50%);width:52px;height:52px;border:1px solid rgba(255,215,0,0.08);background:rgba(7,7,13,0.6);backdrop-filter:blur(8px);color:rgba(232,228,220,0.4);font-size:1.4rem;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;border-radius:50%}
.arrow:hover{border-color:rgba(255,215,0,0.2);color:#e8e4dc;background:rgba(255,215,0,0.04)}
.arrow-l{left:2rem}
.arrow-r{right:2rem}
/* Source indicator dots */
.dot-bar{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:0.6rem;align-items:center}
.dot-group{display:flex;gap:0.3rem;padding:0.3rem 0.6rem;border:1px solid rgba(255,215,0,0.06);background:rgba(7,7,13,0.4);border-radius:3px;cursor:pointer;transition:all 0.3s}
.dot-group:hover{border-color:rgba(255,215,0,0.15)}
.dot-group:hover .dg-label{opacity:0.8}
.dg-dot{width:6px;height:6px;border-radius:50%;opacity:0.3;transition:all 0.3s}
.dg-dot.act{opacity:1;box-shadow:0 0 8px currentColor}
.dg-label{font-family:'JetBrains Mono',monospace;font-size:0.45rem;color:rgba(232,228,220,0.35);letter-spacing:0.06em;transition:opacity 0.3s;margin-left:0.2rem}
/* Group label */
.group-label{position:fixed;top:7rem;left:50%;transform:translateX(-50%);z-index:40;font-family:'Noto Serif SC',serif;font-size:0.75rem;letter-spacing:0.35rem;color:rgba(255,215,0,0.2);text-transform:uppercase;font-weight:300;animation:fsi 0.8s ease-out;pointer-events:none}
/* Click hint */
.click-hint{position:fixed;bottom:2.5rem;left:50%;transform:translateX(-50%);z-index:40;font-family:'JetBrains Mono',monospace;font-size:0.5rem;color:rgba(232,228,220,0.12);letter-spacing:0.12em;text-transform:uppercase;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:0.12}50%{opacity:0.4}}
@keyframes fsi{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* Source colors */
.source-源堡{--sc:#FFD700}.source-混沌海{--sc:#5ab0c4}.source-永暗之河{--sc:#6a4a8a}.source-灾祸之城{--sc:#c45a5a}.source-母巢{--sc:#6aaa6a}.source-暗影世界{--sc:#8a6a4a}.source-失序之国{--sc:#b48bb4}.source-知识荒野{--sc:#4a9a8a}.source-光之钥{--sc:#c4a84a}

@media(max-width:768px){
  .card{width:300px;height:460px;padding:1.5rem}
  .carousel{width:300px;height:460px}
  .card-title{font-size:2rem}
  .arrow-l{left:0.5rem}
  .arrow-r{right:0.5rem}
  .arrow{width:40px;height:40px;font-size:1rem}
  .dot-bar{flex-wrap:wrap;justify-content:center;bottom:4rem;max-width:90vw}
  .group-label{font-size:0.6rem;top:5.5rem}
  nav{padding:0.8rem 1rem}
  nav a{font-size:0.65rem}
}
</style>
</head>
<body>
<div id="noise-layer"></div>
<div id="glow"></div>
<div id="glow2"></div>
<div id="vn"></div>
<div id="dots"></div>
<canvas id="grain-c"></canvas>
<canvas id="tex-c"></canvas>
<canvas id="pt-c"></canvas>

<nav>
  <a href="../index.html" style="font-weight:900;font-size:1.4rem;line-height:1.1;letter-spacing:-0.02em;mix-blend-mode:plus-lighter">诡秘之主</a>
  <div style="display:flex;gap:1.5rem">
    <a href="../index.html">首页</a>
    <a href="characters.html">角色</a>
    <a href="pathways.html" style="opacity:1">途径</a>
    <a href="artifacts.html">封印物</a>
  </div>
</nav>

<div class="group-label" id="groupLabel"></div>
<div class="scene">
  <div class="carousel" id="carousel"></div>
</div>

<button class="arrow arrow-l" id="prevBtn">‹</button>
<button class="arrow arrow-r" id="nextBtn">›</button>

<div class="dot-bar" id="dotBar"></div>
<div class="click-hint">点击卡片查看详情</div>

<script>
// Canvas effects
function initCanvas(id){
  const c=document.getElementById(id);
  if(!c)return;
  const ctx=c.getContext('2d');
  function r(){c.width=window.innerWidth;c.height=window.innerHeight}
  r();
  window.addEventListener('resize',r);
  return{c,ctx,r}
}
initCanvas('grain-c');
setInterval(()=>{
  const c=document.getElementById('grain-c');
  if(!c)return;
  const w=c.width,h=c.height,id=c.getContext('2d').createImageData(w,h),b=id.data;
  for(let i=0;i<b.length;i+=4){b[i]=Math.random()*40+10;b[i+1]=b[i]*0.9;b[i+2]=b[i]*0.7;b[i+3]=25}
  c.getContext('2d').putImageData(id,0,0)
},200);
initCanvas('tex-c');
(function(){
  const c=document.getElementById('tex-c');
  if(!c)return;
  const ctx=c.getContext('2d'),w=c.width,h=c.height;
  const id=ctx.createImageData(w,h),b=id.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4,p=(Math.sin(x*0.05)+Math.sin(y*0.05))*15+128,n=Math.random()*8-4;
    b[i]=p+n;b[i+1]=p*0.8+n;b[i+2]=p*0.5+n;b[i+3]=15
  }
  ctx.putImageData(id,0,0)
})();
const ptc=document.getElementById('pt-c'),ptctx=ptc.getContext('2d');
let pw=0,ph=0,pts=[];
function pr(){pw=ptc.width=window.innerWidth;ph=ptc.height=window.innerHeight;pts=[];for(let i=0;i<80;i++)pts.push({x:Math.random()*pw,y:Math.random()*ph,vx:(Math.random()-0.5)*0.25,vy:(Math.random()-0.5)*0.25,s:Math.random()*1.8+0.3,a:Math.random()*0.35+0.08})}
pr();window.addEventListener('resize',pr);
(function dp(){ptctx.clearRect(0,0,pw,ph);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=pw;if(p.x>pw)p.x=0;if(p.y<0)p.y=ph;if(p.y>ph)p.y=0;ptctx.beginPath();ptctx.arc(p.x,p.y,p.s,0,Math.PI*2);ptctx.fillStyle=`rgba(255,215,0,${p.a})`;ptctx.fill()}requestAnimationFrame(dp)})();

// Pathway data - grouped by source (源质)
var SOURCES = [
  {name:'源堡',color:'#FFD700',paths:[0,1,6]},
  {name:'混沌海',color:'#5ab0c4',paths:[11,5,16,19,12]},
  {name:'永暗之河',color:'#6a4a8a',paths:[8,17,13]},
  {name:'灾祸之城',color:'#c45a5a',paths:[7,3]},
  {name:'母巢',color:'#6aaa6a',paths:[18,21]},
  {name:'暗影世界',color:'#8a6a4a',paths:[14,15]},
  {name:'失序之国',color:'#b48bb4',paths:[4,20]},
  {name:'知识荒野',color:'#4a9a8a',paths:[2,9]},
  {name:'光之钥',color:'#c4a84a',paths:[10]}
];
// Update D array from pathway.html data (key fields only)
var D = [
  {n:'愚者',c:'占卜家',h:'愚者',s:'占卜·秘偶·时之虫',a:'克莱恩·莫雷蒂',y:'源堡',g:'诡秘之主',m:'灵之虫'},
  {n:'魔术师',c:'学徒',h:'门',s:'传送·空间·门',a:'佛尔思·沃尔',y:'源堡',g:'诡秘之主',m:'星之虫'},
  {n:'女祭司',c:'通识者',h:'完美者',s:'知识·机械·蒸汽',a:'贝尔纳黛·古斯塔夫',y:'知识荒野',g:'知识之妖',m:'知识之妖'},
  {n:'女皇',c:'刺客',h:'魔女',s:'毒药·女巫·魅惑',a:'特莉丝',y:'灾祸之城',g:'毁灭天灾',m:'蛇发女妖'},
  {n:'皇帝',c:'律师',h:'黑皇帝',s:'规则·阴谋·独裁',a:'罗塞尔·古斯塔夫',y:'失序之国',g:'失序者',m:'卷毛狒狒'},
  {n:'教皇',c:'水手',h:'暴君',s:'风暴·海洋·雷霆',a:'阿尔杰·威尔逊',y:'混沌海',g:'上帝',m:'海怪'},
  {n:'恋人',c:'偷盗者',h:'错误',s:'窃取·寄生·时之虫',a:'阿蒙',y:'源堡',g:'诡秘之主',m:'时之虫'},
  {n:'战车',c:'猎人',h:'红祭司',s:'火焰·战争·征服',a:'梅迪奇',y:'灾祸之城',g:'毁灭天灾',m:'灾祸巨人'},
  {n:'力量',c:'战士',h:'黄昏巨人',s:'战斗·黎明·守护',a:'科林·伊利亚特',y:'永暗之河',g:'永恒之暗',m:'独眼巨人'},
  {n:'隐者',c:'窥秘人',h:'隐者',s:'神秘·召唤·预言',a:'嘉德丽雅',y:'知识荒野',g:'知识之妖',m:'知识妖精'},
  {n:'命运之轮',c:'怪物',h:'命运之轮',s:'幸运·概率·混乱',a:'威尔·昂赛汀',y:'光之钥',g:'光之钥',m:'衔尾蛇'},
  {n:'正义',c:'观众',h:'空想家',s:'读心·催眠·梦境',a:'奥黛丽·霍尔',y:'混沌海',g:'上帝',m:'心灵巨龙'},
  {n:'倒吊人',c:'秘祈人',h:'倒吊人',s:'低语·献祭·隐秘',a:'真实造物主',y:'混沌海',g:'上帝',m:'阴影与血肉'},
  {n:'死神',c:'收尸人',h:'死神',s:'灵魂·亡灵·冥界',a:'阿兹克·艾格斯',y:'永暗之河',g:'永恒之暗',m:'羽蛇'},
  {n:'节制',c:'囚犯',h:'被缚者',s:'疯狂·诅咒·枷锁',a:'莎伦',y:'暗影世界',g:'恶魔之父',m:'诅咒集合体'},
  {n:'恶魔',c:'罪犯',h:'深渊',s:'暴力·恶魔·深渊',a:'欲望母树',y:'暗影世界',g:'恶魔之父',m:'深渊恶魔'},
  {n:'塔',c:'阅读者',h:'白塔',s:'知识·发明·推理',a:'艾德雯娜·爱德华兹',y:'混沌海',g:'上帝',m:'书籍之塔'},
  {n:'星星',c:'不眠者',h:'黑暗',s:'黑夜·梦境·寂静',a:'伦纳德·米切尔',y:'永暗之河',g:'永恒之暗',m:'四足魔狼'},
  {n:'月亮',c:'药师',h:'月亮',s:'魔药·吸血鬼·生命',a:'埃姆林·怀特',y:'母巢',g:'根源之神',m:'红月人形'},
  {n:'太阳',c:'歌颂者',h:'太阳',s:'光明·黎明·净化',a:'戴里克·伯格',y:'混沌海',g:'上帝',m:'太阳鸟'},
  {n:'审判',c:'仲裁人',h:'审判者',s:'律法·秩序·裁决',a:'休·迪尔查',y:'失序之国',g:'失序者',m:'黄铜巨柱'},
  {n:'世界',c:'耕种者',h:'母亲',s:'自然·丰收·大地',a:'弗兰克·李',y:'母巢',g:'根源之神',m:'原始血肉'}
];
var ROMAN = ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];

// Build ordered list of pathway indices by source groups
var ORDERED = [];
SOURCES.forEach(function(s){
  s.paths.forEach(function(pi){ ORDERED.push(pi); });
});

// Build cards
var carousel = document.getElementById('carousel');
var totalCards = ORDERED.length;
var angleStep = 360 / totalCards;

function buildCarousel(){
  var html = '';
  ORDERED.forEach(function(pi, i){
    var d = D[pi];
    var source = SOURCES.find(function(s){return s.paths.includes(pi)});
    var sc = source ? source.color : '#FFD700';
    var rotY = i * angleStep;
    var zOffset = 0; // all at same radius
    html += '<div class="card" data-idx="' + pi + '" data-source="' + (source?source.name:'') + '" onclick="gotoPathway(' + pi + ')" style="transform:rotateY(' + rotY + 'deg) translateZ(520px)" data-rotY="' + rotY + '">'
      + '<div class="card-c tl"></div><div class="card-c tr"></div><div class="card-c bl"></div><div class="card-c br"></div>'
      + '<div class="card-badge" style="color:' + sc + '">途径 ' + ROMAN[pi] + '</div>'
      + '<div class="card-title">' + d.n + '</div>'
      + '<div class="card-sub">' + d.c + ' → ' + d.h + '</div>'
      + '<div class="card-path"><span>' + d.s.split('·').join('</span><span>') + '</span></div>'
      + '<div class="card-desc">代表角色：' + d.a + ' · 神话形态：' + d.m + '</div>'
      + '<div class="card-source"><div class="source-dot" style="background:' + sc + '"></div><div class="source-label">' + d.y + ' · ' + d.g + '</div></div>'
      + '<div class="card-roman">' + ROMAN[pi] + '</div>'
      + '</div>';
  });
  carousel.innerHTML = html;
}

var currentAngle = 0;
var currentSourceIdx = 0;

function updateCarousel(animate){
  carousel.style.transition = animate ? 'transform 0.8s cubic-bezier(0.65,0,0.35,1)' : 'none';
  carousel.style.transform = 'rotateY(' + currentAngle + 'deg)';
  
  // Update group label
  var visibleIdx = Math.floor(((-currentAngle % 360 + 360) % 360) / angleStep) % totalCards;
  var visiblePi = ORDERED[visibleIdx];
  var source = SOURCES.find(function(s){return s.paths.includes(visiblePi)});
  if(source){
    document.getElementById('groupLabel').textContent = source.name;
    document.getElementById('groupLabel').style.color = source.color;
  }
  
  // Update dots
  document.querySelectorAll('.dg-dot').forEach(function(dot, i){
    dot.classList.toggle('act', i === currentSourceIdx);
  });
}

function goToSource(idx){
  if(idx < 0) idx = SOURCES.length - 1;
  if(idx >= SOURCES.length) idx = 0;
  currentSourceIdx = idx;
  var source = SOURCES[idx];
  // Find where this source's first pathway is in the ORDERED list
  var firstPi = source.paths[0];
  var pos = ORDERED.indexOf(firstPi);
  if(pos >= 0){
    currentAngle = -(pos * angleStep) + (360 - angleStep * totalCards / 2) % 360;
    updateCarousel(true);
  }
  // Update dot bar active state
  document.querySelectorAll('.dg-dot').forEach(function(dot, i){
    dot.classList.toggle('act', i === idx);
  });
}

function gotoPathway(pi){
  location.href = 'pathway.html?id=' + pi;
}

// Build dot bar (source groups)
function buildDotBar(){
  var html = '';
  SOURCES.forEach(function(s, si){
    html += '<div class="dot-group" onclick="goToSource(' + si + ')" title="' + s.name + '">';
    s.paths.forEach(function(){
      html += '<div class="dg-dot" style="color:' + s.color + ';background:currentColor"></div>';
    });
    html += '<span class="dg-label">' + s.name + '</span></div>';
  });
  document.getElementById('dotBar').innerHTML = html;
}

// Navigation
document.getElementById('prevBtn').addEventListener('click', function(){
  currentAngle -= angleStep;
  // Update currentSourceIdx based on visible card
  updateCarousel(true);
});
document.getElementById('nextBtn').addEventListener('click', function(){
  currentAngle += angleStep;
  updateCarousel(true);
});

// Keyboard nav
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowLeft') { currentAngle -= angleStep; updateCarousel(true); }
  if(e.key === 'ArrowRight') { currentAngle += angleStep; updateCarousel(true); }
  if(e.key === 'Enter') {
    var visibleIdx = Math.floor(((-currentAngle % 360 + 360) % 360) / angleStep) % totalCards;
    var pi = ORDERED[visibleIdx];
    gotoPathway(pi);
  }
});

// Init
buildCarousel();
buildDotBar();
goToSource(0);
</script>
</body>
</html>
