<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>非凡途径 — 诡秘之主</title>
<script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;700;900&family=Noto+Serif+SC:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',sans-serif;background:#07070d;color:#e8e4dc;overflow:hidden;width:100vw;height:100vh;cursor:crosshair}

/* Hermes signature overlay layers */
#noise-layer{pointer-events:none;position:fixed;inset:0;mix-blend-mode:difference;opacity:0.065;z-index:101}
#invert-layer{pointer-events:none;position:fixed;inset:0;background:color-mix(in srgb,#fff 100%,transparent);mix-blend-mode:difference;z-index:100}
#glow{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at 0% 0%,rgba(255,189,56,0) 40%,rgba(255,189,56,0.40) 100%);mix-blend-mode:screen;opacity:0.15;z-index:99}
#glow2{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at 100% 100%,rgba(180,120,50,0) 30%,rgba(180,120,50,0.35) 100%);mix-blend-mode:screen;opacity:0.12;z-index:98}
#vn{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.65) 100%);z-index:96}
#dots{pointer-events:none;position:fixed;inset:0;background-image:radial-gradient(rgba(255,215,0,0.025) 1px,transparent 1px);background-size:28px 28px;z-index:95}

/* HUD */
.hud{position:fixed;inset:2rem;z-index:90;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:rgba(232,228,220,0.35);text-transform:uppercase;letter-spacing:0.12em}
.hud-top,.hud-btm{display:flex;justify-content:space-between;align-items:center}
.hud strong{color:rgba(255,215,0,0.7);font-weight:400}
.hud-line{flex:1;height:1px;background:rgba(255,215,0,0.06);margin:0 1rem;position:relative}
.hud-line::after{content:'';position:absolute;right:0;top:-3px;width:5px;height:5px;background:rgba(255,215,0,0.3);clip-path:polygon(0 0,100% 0,100% 100%)}

/* Viewport */
.viewport{position:fixed;inset:0;perspective:1000px;overflow:hidden;z-index:1}
.world{position:absolute;top:50%;left:50%;transform-style:preserve-3d;will-change:transform}
.item{position:absolute;left:0;top:0;backface-visibility:hidden;transform-origin:center center}

/* Cards */
.card{width:300px;height:400px;background:rgba(7,7,13,0.35);border:1px solid rgba(255,215,0,0.06);position:relative;padding:1.8rem;display:flex;flex-direction:column;justify-content:space-between;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(0,0,0,0.5),0 15px 40px rgba(0,0,0,0.4);transition:all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);transform:translate(-50%,-50%)}
.card:hover{border-color:rgba(255,215,0,0.3);box-shadow:0 0 40px rgba(255,215,0,0.08);z-index:100}
.card::before,.card::after{content:'';position:absolute;width:8px;height:8px;border:1px solid transparent;transition:0.3s}
.card::before{top:-1px;left:-1px;border-top-color:rgba(232,228,220,0.3);border-left-color:rgba(232,228,220,0.3)}
.card::after{bottom:-1px;right:-1px;border-bottom-color:rgba(232,228,220,0.3);border-right-color:rgba(232,228,220,0.3)}
.card:hover::before,.card:hover::after{width:60%;height:60%;border-color:rgba(255,215,0,0.4)}
.card-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,215,0,0.06);padding-bottom:0.75rem;margin-bottom:0.75rem}
.card-id{font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:rgba(255,215,0,0.4);letter-spacing:0.15em}
.card h2{font-size:1.8rem;line-height:0.9;margin:0;font-weight:900;color:#e8e4dc;mix-blend-mode:plus-lighter;letter-spacing:0.02em}
.card .sub{font-size:0.65rem;color:rgba(255,215,0,0.3);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.15em;margin-top:0.25rem}
.card-desc{font-size:0.6rem;color:rgba(232,228,220,0.25);font-family:'JetBrains Mono',monospace;line-height:1.6;margin-top:0.4rem;letter-spacing:0.05em}
.card-footer{margin-top:auto;font-family:'JetBrains Mono',monospace;font-size:0.5rem;color:rgba(232,228,220,0.2);display:flex;justify-content:space-between;letter-spacing:0.1em}
.card-badge{position:absolute;bottom:1.2rem;right:1.2rem;font-size:2.5rem;opacity:0.04;font-weight:900;color:#FFD700;line-height:1;pointer-events:none}
.card-char{font-size:0.6rem;color:rgba(232,228,220,0.3);margin-top:0.3rem;font-family:'JetBrains Mono',monospace;letter-spacing:0.05em}

/* Big text */
.big-text{font-size:10vw;font-weight:900;color:transparent;-webkit-text-stroke:1.5px rgba(255,215,0,0.06);text-transform:uppercase;white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;letter-spacing:-0.2rem;mix-blend-mode:overlay;font-family:'Noto Sans SC',sans-serif}

/* Stars */
.star{position:absolute;width:2px;height:2px;background:rgba(255,215,0,0.3);transform:translate(-50%,-50%)}
.scroll-proxy{height:10000vh;position:absolute;width:100%;z-index:-1}
</style>
</head>
<body>

<!-- Hermes overlays -->
<div id="noise-layer"></div>
<div id="invert-layer"></div>
<div id="glow"></div>
<div id="glow2"></div>
<div id="vn"></div>
<div id="dots"></div>

<!-- NAV (matching index.html style) -->
<nav style="position:fixed;top:0;left:0;right:0;z-index:92;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid rgba(255,215,0,0.08);pointer-events:auto;mix-blend-mode:difference;background:linear-gradient(180deg,rgba(7,7,13,0.3) 0%,transparent 100%)">
  <a href="../index.html" style="font-weight:900;font-size:1.4rem;line-height:1.1;letter-spacing:-0.02em;mix-blend-mode:plus-lighter;color:#e8e4dc;text-decoration:none">诡秘之主</a>
  <div style="display:flex;gap:1.5rem">
    <a href="../index.html" style="font-family:JetBrains Mono,monospace;font-size:0.7rem;letter-spacing:0.12rem;color:rgba(232,228,220,0.4);text-decoration:none;text-transform:uppercase;transition:color 0.2s" onmouseover="this.style.color='#e8e4dc'" onmouseout="this.style.color='rgba(232,228,220,0.4)'">首页</a>
    <span style="font-family:JetBrains Mono,monospace;font-size:0.7rem;letter-spacing:0.12rem;text-transform:uppercase"><span style="color:#e8e4dc">途径</span></span>
    <a href="characters.html" style="font-family:JetBrains Mono,monospace;font-size:0.7rem;letter-spacing:0.12rem;color:rgba(232,228,220,0.4);text-decoration:none;text-transform:uppercase;transition:color 0.2s" onmouseover="this.style.color='#e8e4dc'" onmouseout="this.style.color='rgba(232,228,220,0.4)'">角色</a>
    <a href="artifacts.html" style="font-family:JetBrains Mono,monospace;font-size:0.7rem;letter-spacing:0.12rem;color:rgba(232,228,220,0.4);text-decoration:none;text-transform:uppercase;transition:color 0.2s" onmouseover="this.style.color='#e8e4dc'" onmouseout="this.style.color='rgba(232,228,220,0.4)'">封印物</a>
  </div>
</nav>

<!-- HUD -->
<div class="hud">
  <div class="hud-top">
    <span>LOTM.SYS</span>
    <div class="hud-line"></div>
    <span>FPS: <strong id="fps">60</strong></span>
  </div>
  <div class="hud-btm">
    <span>途径: <strong id="coord">—</strong></span>
    <div class="hud-line"></div>
    <span>非凡序列 TUNNEL • 22</span>
  </div>
</div>

<div class="viewport" id="viewport">
  <div class="world" id="world"></div>
</div>
<div class="scroll-proxy"></div>

<script>
var D = [
  {n:'愚者',c:'占卜家',s:'秘偶 · 时之虫 · 命运',a:'克莱恩·莫雷蒂'},
  {n:'魔法师',c:'偷盗者',s:'窃取 · 寄生 · 时之虫',a:'阿蒙'},
  {n:'世界',c:'学徒',s:'传送 · 空间 · 门',a:'罗塞尔·古斯塔夫'},
  {n:'正义',c:'观众',s:'读心 · 催眠 · 梦境',a:'奥黛丽·霍尔'},
  {n:'月亮',c:'不眠者',s:'黑夜 · 梦境 · 寂静',a:'伦纳德·米切尔'},
  {n:'太阳',c:'太阳',s:'光明 · 黎明 · 净化',a:'戴里克·伯格'},
  {n:'星星',c:'窥秘人',s:'知识 · 发明 · 机械',a:'—'},
  {n:'倒吊人',c:'猎人',s:'火焰 · 战争 · 征服',a:'阿尔杰·威尔逊'},
  {n:'死神',c:'收尸人',s:'灵魂 · 亡灵 · 冥界',a:'阿兹克·艾格斯'},
  {n:'命运之轮',c:'怪物',s:'幸运 · 概率 · 混乱',a:'威尔·昂赛汀'},
  {n:'隐者',c:'窥秘人',s:'神秘 · 召唤 · 预言',a:'—'},
  {n:'力量',c:'战士',s:'战斗 · 黎明 · 守护',a:'—'},
  {n:'恶魔',c:'秘祈人',s:'低语 · 献祭 · 隐秘',a:'—'},
  {n:'女皇',c:'药师',s:'魔药 · 吸血鬼 · 生命',a:'血族'},
  {n:'皇帝',c:'耕种者',s:'自然 · 丰收 · 大地',a:'—'},
  {n:'审判',c:'仲裁人',s:'律法 · 秩序 · 裁决',a:'—'},
  {n:'战车',c:'水手',s:'风暴 · 海洋 · 雷霆',a:'—'},
  {n:'高塔',c:'囚犯',s:'疯狂 · 诅咒 · 枷锁',a:'—'},
  {n:'女祭司',c:'刺客',s:'毒药 · 女巫 · 魅惑',a:'特莉丝'},
  {n:'教皇',c:'通识者',s:'知识 · 机械 · 蒸汽',a:'—'},
  {n:'皇帝',c:'律师',s:'规则 · 阴谋 · 独裁',a:'罗塞尔'},
  {n:'恋人',c:'罪犯',s:'暴力 · 恶魔 · 深渊',a:'—'}
];

const CONFIG = {itemCount: D.length, starCount: 80, zGap: 550, loopSize: 0, camSpeed: 2.5};
CONFIG.loopSize = CONFIG.itemCount * CONFIG.zGap;
const BIG_TEXTS = ["诡秘","之主","非凡","途径","序列","命运","愚者","世界"];

const world = document.getElementById('world');
const viewport = document.getElementById('viewport');
const items = [];

function init() {
  for (let i = 0; i < CONFIG.itemCount; i++) {
    const el = document.createElement('div');
    el.className = 'item';
    const d = D[i];
    
    if (i % 3 === 0) {
      const txt = document.createElement('div');
      txt.className = 'big-text';
      txt.innerText = BIG_TEXTS[i % BIG_TEXTS.length];
      el.appendChild(txt);
      items.push({el, type:'text', x:0, y:0, rot:0, baseZ:-i * CONFIG.zGap});
    } else {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          <span class="card-id">途径</span>
          <div style="width:6px;height:6px;border:1px solid rgba(255,215,0,0.15)"></div>
        </div>
        <div>
          <h2>${d.n}</h2>
          <div class="sub">${d.c}</div>
          <div class="card-desc">${d.s}</div>
          <div class="card-char">${d.a}</div>
        </div>
        <div class="card-footer">
          <span>序列 9 → 0</span>
          <span>LOTM</span>
        </div>
        <div class="card-badge">${String(i+1).padStart(2,'0')}</div>
      `;
      el.appendChild(card);
      items.push({el, type:'card', x:(Math.random()-0.5)*250, y:(Math.random()-0.5)*150, rot:(Math.random()-0.5)*15, baseZ:-i * CONFIG.zGap});
    }
    world.appendChild(el);
  }

  for (let i = 0; i < CONFIG.starCount; i++) {
    const el = document.createElement('div');
    el.className = 'star';
    world.appendChild(el);
    items.push({el, type:'star', x:(Math.random()-0.5)*3000, y:(Math.random()-0.5)*3000, baseZ:-Math.random()*CONFIG.loopSize});
  }
}
init();

const lenis = new Lenis({smooth:true, lerp:0.08, direction:'vertical', gestureDirection:'vertical', smoothTouch:true});
lenis.on('scroll', ({scroll, velocity}) => {state.scroll = scroll; state.targetSpeed = velocity});

const state = {scroll:0, velocity:0, targetSpeed:0, mouseX:0, mouseY:0};
const fpsEl = document.getElementById('fps');
const coordEl = document.getElementById('coord');
let lastTime = 0;

window.addEventListener('mousemove', (e) => {state.mouseX = (e.clientX/innerWidth-0.5)*2; state.mouseY = (e.clientY/innerHeight-0.5)*2});

function raf(time) {
  lenis.raf(time);
  const delta = time - lastTime; lastTime = time;
  if (time % 10 < 1) fpsEl.innerText = Math.round(1000/delta);
  state.velocity += (state.targetSpeed - state.velocity) * 0.1;
  
  const cameraZ = state.scroll * CONFIG.camSpeed;
  const tiltX = state.mouseY * 3 - state.velocity * 0.3;
  const tiltY = state.mouseX * 3;
  world.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
  
  const fov = 1000 - Math.min(Math.abs(state.velocity) * 8, 500);
  viewport.style.perspective = `${fov}px`;

  items.forEach(item => {
    let relZ = item.baseZ + cameraZ;
    const modC = CONFIG.loopSize;
    let vizZ = ((relZ % modC) + modC) % modC;
    if (vizZ > modC/2) vizZ -= modC;
    
    let alpha = 1;
    if (vizZ < -3000) alpha = 0;
    else if (vizZ < -2000) alpha = (vizZ + 3000) / 1000;
    if (vizZ > 100 && item.type !== 'star') alpha = 1 - ((vizZ - 100) / 400);
    if (alpha < 0) alpha = 0;
    item.el.style.opacity = alpha;
    
    // Scale items as they approach
    let scale = 1;
    if (item.type !== 'star' && vizZ > 0) {
      scale = 1 + (vizZ / 2000) * 0.3; // slight grow as they approach
    }
    
    if (alpha > 0) {
      let trans = `translate3d(${item.x}px, ${item.y}px, ${vizZ}px)`;
      if (item.type === 'star') {
        const stretch = Math.max(1, Math.min(1+Math.abs(state.velocity)*0.08, 8));
        trans += ` scale3d(1, 1, ${stretch})`;
      } else if (item.type === 'text') {
        trans += ` rotateZ(${item.rot}deg) scale(${scale})`;
        if (Math.abs(state.velocity) > 1.5) {
          const off = state.velocity * 1.5;
          item.el.style.textShadow = `${off}px 0 rgba(255,215,0,0.15), ${-off}px 0 rgba(180,180,220,0.15)`;
        } else item.el.style.textShadow = 'none';
      } else {
        const t = time * 0.001;
        const float = Math.sin(t + item.x * 0.01) * 5;
        trans += ` rotateZ(${item.rot}deg) rotateY(${float}deg) scale(${scale})`;
      }
      item.el.style.transform = trans;
    }
  });

  // Update HUD pathway name
  const idx = Math.floor((state.scroll * CONFIG.camSpeed) / CONFIG.zGap) % D.length;
  coordEl.innerText = D[idx] ? D[idx].n + ' · ' + D[idx].c : '—';
  
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);
</script>
</body>
</html>
