<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>非凡途径 — 诡秘之主</title>
<script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;700;900&family=Noto+Serif+SC:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans SC',sans-serif;background:#07070d;color:#e8e4dc;min-height:100vh;cursor:crosshair}

/* Hermes signature overlay layers */
#noise-layer{pointer-events:none;position:fixed;inset:0;mix-blend-mode:difference;opacity:0.065;z-index:101}
#invert-layer{pointer-events:none;position:fixed;inset:0;background:color-mix(in srgb,#fff 100%,transparent);mix-blend-mode:difference;z-index:100}
#glow{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at 0% 0%,rgba(255,189,56,0) 40%,rgba(255,189,56,0.40) 100%);mix-blend-mode:screen;opacity:0.15;z-index:99}
#glow2{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at 100% 100%,rgba(180,120,50,0) 30%,rgba(180,120,50,0.35) 100%);mix-blend-mode:screen;opacity:0.12;z-index:98}
#vn{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.65) 100%);z-index:96}
#dots{pointer-events:none;position:fixed;inset:0;background-image:radial-gradient(rgba(255,215,0,0.025) 1px,transparent 1px);background-size:28px 28px;z-index:95}

/* HUD */
.hud{position:fixed;inset:2rem;z-index:90;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:rgba(232,228,220,0.35);text-transform:uppercase;letter-spacing:0.12em}
.hud-top,.hud-btm{display:flex;justify-content:space-between;align-items:center}
.hud strong{color:rgba(255,215,0,0.7);font-weight:400}
.hud-line{flex:1;height:1px;background:rgba(255,215,0,0.06);margin:0 1rem;position:relative}
.hud-line::after{content:'';position:absolute;right:0;top:-3px;width:5px;height:5px;background:rgba(255,215,0,0.3);clip-path:polygon(0 0,100% 0,100% 100%)}

/* 3D Tunnel */
.viewport{position:fixed;inset:0;perspective:1000px;overflow:hidden;z-index:1}
.world{position:absolute;top:38%;left:50%;transform-style:preserve-3d;will-change:transform}
.item{position:absolute;left:0;top:0;backface-visibility:hidden;transform-origin:center center}

/* Tunnel Cards */
.card{width:300px;height:400px;background:rgba(7,7,13,0.35);border:1px solid rgba(255,215,0,0.06);position:relative;padding:1.8rem;display:flex;flex-direction:column;justify-content:space-between;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(0,0,0,0.5),0 15px 40px rgba(0,0,0,0.4);transition:all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);transform:translate(-50%,-50%)}
.card:hover{border-color:rgba(255,215,0,0.3);box-shadow:0 0 40px rgba(255,215,0,0.08);z-index:100}
.card::before,.card::after{content:'';position:absolute;width:8px;height:8px;border:1px solid transparent;transition:0.3s}
.card::before{top:-1px;left:-1px;border-top-color:rgba(232,228,220,0.3);border-left-color:rgba(232,228,220,0.3)}
.card::after{bottom:-1px;right:-1px;border-bottom-color:rgba(232,228,220,0.3);border-right-color:rgba(232,228,220,0.3)}
.card:hover::before,.card:hover::after{width:60%;height:60%;border-color:rgba(255,215,0,0.4)}
.card-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,215,0,0.06);padding-bottom:0.75rem;margin-bottom:0.75rem}
.card-id{font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:rgba(255,215,0,0.4);letter-spacing:0.15em}
.card h2{font-size:1.8rem;line-height:0.9;margin:0;font-weight:900;color:#e8e4dc;mix-blend-mode:plus-lighter;letter-spacing:0.02em}
.card .sub{font-size:0.65rem;color:rgba(255,215,0,0.3);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.15em;margin-top:0.25rem}
.card-desc{font-size:0.6rem;color:rgba(232,228,220,0.25);font-family:'JetBrains Mono',monospace;line-height:1.6;margin-top:0.4rem;letter-spacing:0.05em}
.card-footer{margin-top:auto;font-family:'JetBrains Mono',monospace;font-size:0.5rem;color:rgba(232,228,220,0.2);display:flex;justify-content:space-between;letter-spacing:0.1em}
.card-badge{position:absolute;bottom:1.2rem;right:1.2rem;font-size:2.5rem;opacity:0.04;font-weight:900;color:#FFD700;line-height:1;pointer-events:none}
.card-char{font-size:0.6rem;color:rgba(232,228,220,0.3);margin-top:0.3rem;font-family:'JetBrains Mono',monospace;letter-spacing:0.05em}

/* Big text */
.big-text{font-size:10vw;font-weight:900;color:transparent;-webkit-text-stroke:1.5px rgba(255,215,0,0.06);text-transform:uppercase;white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;letter-spacing:-0.2rem;mix-blend-mode:overlay;font-family:'Noto Sans SC',sans-serif}

/* Stars */
.star{position:absolute;width:2px;height:2px;background:rgba(255,215,0,0.3);transform:translate(-50%,-50%)}
.scroll-proxy{height:30000vh;position:absolute;width:100%;z-index:-1;pointer-events:none}

/* ===== TAROT GALLERY (fixed at bottom) ===== */
.tarot-section{position:fixed;bottom:0;left:0;right:0;z-index:51;padding:7rem 2rem 0.5rem;background:linear-gradient(0deg,#07070d 80%,rgba(7,7,13,0.7) 95%,transparent 100%);pointer-events:auto}
.tarot-section .tarot-inner{max-width:1600px;margin:0 auto}
.tarot-section .sl{font-family:'Noto Serif SC',serif;font-size:0.7rem;letter-spacing:0.2rem;margin-bottom:0.4rem;color:rgba(232,228,220,0.4)}
.tarot-track{display:flex;gap:0.6rem;padding:0.15rem 2.5rem;overflow-x:auto;overflow-y:visible;scroll-behavior:smooth;scroll-snap-type:x mandatory;padding-bottom:0.3rem}
.tarot-track::-webkit-scrollbar{height:2px}
.tarot-track::-webkit-scrollbar-track{background:rgba(255,215,0,0.04)}
.tarot-track::-webkit-scrollbar-thumb{background:rgba(255,215,0,0.15);border-radius:2px}
.tcard{flex:0 0 175px;scroll-snap-align:start;transition:all 0.4s;cursor:pointer;overflow:visible}
.tcard:hover{transform:translateY(-6px)}
.tcard.tactive{transform:scale(1.06);z-index:5}
.tcard.tactive .tci{border-color:#FFD700;box-shadow:0 0 40px rgba(255,215,0,0.35),0 0 80px rgba(255,215,0,0.1),inset 0 0 60px rgba(255,215,0,0.06);border-width:1.5px}
.tcard.tactive .tns{color:#FFD700;text-shadow:0 0 25px rgba(255,215,0,0.4),0 0 50px rgba(255,215,0,0.15)}
.tcard.tactive .tcn,.tcard.tactive .tpt{color:#FFD700;opacity:1}
.tcard.tactive .tdv{background:linear-gradient(90deg,transparent,rgba(255,215,0,0.6),transparent)}
.tci{width:175px;height:330px;background:linear-gradient(180deg,#0c0c18,#07070d);border:1px solid rgba(255,215,0,0.12);border-radius:6px;padding:0.5rem;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.3),inset 0 0 40px rgba(255,215,0,0.02)}
.tci::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:5px;border:1px solid rgba(255,215,0,0.06);pointer-events:none}
.tci::after{content:'';position:absolute;top:6px;left:6px;right:6px;bottom:6px;border:1px solid rgba(255,215,0,0.04);border-radius:3px;pointer-events:none}
.tci .tcn{font-family:JetBrains Mono,monospace;font-size:0.6rem;color:rgba(255,215,0,0.35);font-weight:300}
.tci .tns{font-size:0.8rem;font-weight:700;letter-spacing:0.12em;mix-blend-mode:plus-lighter;text-align:center;z-index:1}
.tci .tdv{width:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,215,0,0.12),transparent);z-index:1}
.tci .tpt{font-family:JetBrains Mono,monospace;font-size:0.5rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,215,0,0.35);z-index:1}
.tci .tds{font-size:0.5rem;color:rgba(232,228,220,0.25);text-align:center;line-height:1.3;z-index:1;padding:0 0.3rem}
.tnav{position:absolute;top:50%;transform:translateY(-50%);z-index:15;width:1.8rem;height:1.8rem;border-radius:50%;border:1px solid rgba(255,215,0,0.12);background:rgba(7,7,13,0.85);color:#FFD700;font-size:1.1rem;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center}
.tnav:hover{background:rgba(255,215,0,0.08);border-color:rgba(255,215,0,0.25)}
.tprev{left:0.2rem}.tnext{right:0.2rem}
.tarot-wrapper{position:relative;padding:0.2rem 0}
.tarot-footer{text-align:center;padding:2rem 0 0.5rem;font-family:'JetBrains Mono',monospace;font-size:0.5rem;color:rgba(232,228,220,0.15);letter-spacing:0.15em}

/* ===== DETAIL MODAL ===== */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(7,7,13,0.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.4s;backdrop-filter:blur(10px)}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-box{max-width:560px;width:90%;background:#0a0a14;border:1px solid rgba(255,215,0,0.12);padding:2.5rem;position:relative;transform:scale(0.9) translateY(20px);transition:transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);max-height:85vh;overflow-y:auto}
.modal-overlay.open .modal-box{transform:scale(1) translateY(0)}
.modal-box::before,.modal-box::after{content:'';position:absolute;width:12px;height:12px;border:1px solid rgba(255,215,0,0.15);transition:0.3s}
.modal-box::before{top:-1px;left:-1px;border-top-color:rgba(255,215,0,0.3);border-left-color:rgba(255,215,0,0.3)}
.modal-box::after{bottom:-1px;right:-1px;border-bottom-color:rgba(255,215,0,0.3);border-right-color:rgba(255,215,0,0.3)}
.modal-close{position:absolute;top:0.8rem;right:1rem;background:none;border:none;color:rgba(232,228,220,0.3);font-size:1.5rem;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:color 0.3s;z-index:5}
.modal-close:hover{color:#FFD700}
.modal-header{border-bottom:1px solid rgba(255,215,0,0.08);padding-bottom:1.2rem;margin-bottom:1.2rem}
.modal-tarot{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:rgba(255,215,0,0.4);letter-spacing:0.15em}
.modal-title{font-size:2rem;font-weight:900;mix-blend-mode:plus-lighter;line-height:1.1;margin-top:0.2rem}
.modal-sub{font-size:1rem;color:rgba(255,215,0,0.4);font-family:'JetBrains Mono',monospace;letter-spacing:0.1em;margin-top:0.3rem;text-transform:uppercase}
.modal-section{margin-bottom:1rem}
.modal-section label{font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:rgba(255,215,0,0.3);letter-spacing:0.15em;text-transform:uppercase;display:block;margin-bottom:0.3rem}
.modal-section p{font-size:0.8rem;color:rgba(232,228,220,0.6);line-height:1.8;text-transform:none;letter-spacing:0.03em}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
.modal-grid .mg{background:rgba(255,215,0,0.02);border:1px solid rgba(255,215,0,0.04);padding:0.6rem 0.8rem}
.modal-grid .mg label{font-family:'JetBrains Mono',monospace;font-size:0.5rem;color:rgba(255,215,0,0.25);letter-spacing:0.12em;text-transform:uppercase;display:block}
.modal-grid .mg span{font-size:0.78rem;color:rgba(232,228,220,0.55);font-weight:300;display:block;margin-top:0.15rem}
.modal-desc{font-size:0.78rem;color:rgba(232,228,220,0.45);line-height:1.8;text-transform:none;padding:0.8rem;background:rgba(255,215,0,0.015);border-left:2px solid rgba(255,215,0,0.1);margin-top:0.5rem}
.modal-seq{display:flex;gap:0.2rem;flex-wrap:wrap;margin-top:0.3rem}
.modal-seq span{padding:0.2rem 0.5rem;background:rgba(255,215,0,0.03);border:1px solid rgba(255,215,0,0.06);font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:rgba(232,228,220,0.35);letter-spacing:0.05em}
.modal-seq span.hl{color:rgba(255,215,0,0.7);border-color:rgba(255,215,0,0.12)}

@media(max-width:768px){
  .tarot-section{padding:2rem 1rem;margin-top:100vh}
  .tarot-track{padding:0.5rem 1.5rem}
  .tcard{flex:0 0 155px}
  .tci{width:155px;height:300px}
}
</style>
</head>
<body>

<!-- Hermes overlays -->
<div id="noise-layer"></div>
<div id="invert-layer"></div>
<div id="glow"></div>
<div id="glow2"></div>
<div id="vn"></div>
<div id="dots"></div>

<!-- NAV (matching index.html style) -->
<nav style="position:fixed;top:0;left:0;right:0;z-index:92;border-bottom:1px solid rgba(255,215,0,0.08);pointer-events:auto;mix-blend-mode:difference;background:linear-gradient(180deg,rgba(7,7,13,0.25) 0%,transparent 100%)">
  <div style="max-width:1600px;margin:0 auto;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between">
    <a href="../index.html" style="font-weight:900;font-size:1.4rem;line-height:1.1;letter-spacing:-0.02em;mix-blend-mode:plus-lighter;color:#e8e4dc;text-decoration:none">诡秘之主</a>
    <div style="display:flex;gap:1.5rem">
      <a href="../index.html" style="font-family:JetBrains Mono,monospace;font-size:0.7rem;letter-spacing:0.12rem;color:rgba(232,228,220,0.4);text-decoration:none;text-transform:uppercase;transition:color 0.2s" onmouseover="this.style.color='#e8e4dc'" onmouseout="this.style.color='rgba(232,228,220,0.4)'">首页</a>
      <a href="characters.html" style="font-family:JetBrains Mono,monospace;font-size:0.7rem;letter-spacing:0.12rem;color:rgba(232,228,220,0.4);text-decoration:none;text-transform:uppercase;transition:color 0.2s" onmouseover="this.style.color='#e8e4dc'" onmouseout="this.style.color='rgba(232,228,220,0.4)'">角色</a>
      <span style="font-family:JetBrains Mono,monospace;font-size:0.7rem;letter-spacing:0.12rem;text-transform:uppercase"><span style="color:#e8e4dc">途径</span></span>

<!-- HUD -->
<div class="hud">
  <div class="hud-top">
    <span>LOTM.SYS</span>
    <div class="hud-line"></div>
    <span>FPS: <strong id="fps">60</strong></span>
  </div>
  <div class="hud-btm">
    <span>途径: <strong id="coord">—</strong></span>
    <div class="hud-line"></div>
    <span>非凡序列 TUNNEL • 22</span>
  </div>
</div>

<!-- 3D Tunnel -->

  <div class="world" id="world"></div>
</div>

<!-- ===== TAROT GALLERY (fixed at bottom) ===== -->
<section class="tarot-section">
  <div class="tarot-inner">
    <div class="sl">▍22条非凡途径 · 塔罗牌画廊</div>
    <div class="tarot-wrapper">
      <div class="tarot-track" id="tarotTrack"></div>
    <button class="tnav tprev" id="tarotPrev">‹</button>
    <button class="tnav tnext" id="tarotNext">›</button>

<!-- DETAIL MODAL -->

  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-header">
      <div class="modal-tarot" id="mTarot">—</div>
      <div class="modal-title" id="mTitle">—</div>
      <div class="modal-sub" id="mSub">—</div>
    </div>
    <div class="modal-grid">
      <div class="mg"><label>序列9（低）</label><span id="mSeq9">—</span></div>
      <div class="mg"><label>序列0（高）</label><span id="mSeq0">—</span></div>
      <div class="mg"><label>代表人物</label><span id="mChar">—</span></div>
      <div class="mg"><label>塔罗牌号</label><span id="mCardNo">—</span></div>
    </div>
    <div class="modal-desc" id="mDesc">—</div>
    <div class="modal-section">
      <label>序列晋升路径</label>
      <div class="modal-seq" id="mSeqPath"></div>
    </div>
  </div>
</div>

<script>
var D = [
  {n:'愚者',c:'占卜家',s:'占卜·秘偶·时之虫',a:'克莱恩·莫雷蒂',h:'愚者',d:'占卜家途径，诡秘三途径之一。序列0「愚者」权柄为秘偶、时之虫、命运。克莱恩·莫雷蒂穿越后踏上此途，最终以永恒的沉睡成为诡秘之主。',q:'占卜家→小丑→魔术师→无面人→秘偶大师→诡法师→古代学者→奇迹师→诡秘侍者→愚者'},
  {n:'魔术师',c:'学徒',s:'传送·空间·门',a:'佛尔思·沃尔',h:'门',d:'学徒途径，诡秘三途径之一。序列0「门」权柄为传送、空间、记录。代表人物佛尔思·沃尔，塔罗会「魔术师」成员。',q:'学徒→戏法大师→占星人→记录官→旅行家→秘法师→漫游者→旅法师→星之匙→门'},
  {n:'女祭司',c:'通识者',s:'知识·机械·蒸汽',a:'贝尔纳黛·古斯塔夫',h:'完美者',d:'通识者途径。序列0「完美者」权柄为知识、机械、蒸汽与工业。贝尔纳黛·古斯塔夫为迷雾海最强大的冒险家之一。',q:'通识者→考古学家→鉴定师→机械专家→炼金术士→奥术学者→预言家→贤者→知识皇帝→完美者'},
  {n:'女皇',c:'刺客',s:'毒药·女巫·魅惑',a:'特莉丝',h:'魔女',d:'刺客途径，序列0「魔女」。权柄为毒药、女巫、魅惑与厄运。特莉丝作为该途径的代表人物，经历了从序列7到序列4的晋升。',q:'刺客→教唆者→女巫→欢愉魔女→痛苦魔女→绝望魔女→不老魔女→末日魔女→灾难魔女→魔女'},
  {n:'皇帝',c:'律师',s:'规则·阴谋·独裁',a:'罗塞尔·古斯塔夫',h:'黑皇帝',d:'律师途径。序列0「黑皇帝」权柄为规则、秩序、独裁。罗塞尔·古斯塔夫是穿越者前辈，曾建立日不落帝国，留下大量日记指引克莱恩。',q:'律师→野蛮人→贿赂者→腐化男爵→混乱导师→堕落伯爵→狂乱法师→天灾→弑光亲王→黑皇帝'},
  {n:'教皇',c:'水手',s:'风暴·海洋·雷霆',a:'阿尔杰·威尔逊',h:'暴君',d:'水手途径。序列0「暴君」权柄为风暴、海洋、雷霆。阿尔杰·威尔逊为塔罗会「教皇」，从海上冒险家成长为半神。',q:'水手→航海家→风眷者→海洋歌者→灾难主祭→海王→天灾→天气术师→雷神→暴君'},
  {n:'恋人',c:'偷盗者',s:'窃取·寄生·时之虫',a:'阿蒙',h:'错误',d:'偷盗者途径，诡秘三途径之一。序列0「错误」权柄为窃取、寄生、时之虫。阿蒙为远古太阳神之子，与克莱恩争夺源堡的宿敌。',q:'偷盗者→诈骗师→解密学者→寄生者→窃梦家→盗火者→时之虫→命运木马→错误道人→错误'},
  {n:'战车',c:'猎人',s:'火焰·战争·征服',a:'索伦/梅迪奇',h:'红祭司',d:'猎人途径。序列0「红祭司」权柄为火焰、战争、征服。代表人物索伦·艾因霍恩·梅迪奇，是远古太阳神座下天使之王。',q:'猎人→挑衅者→收割者→阴谋家→灵魂收割者→战争主教→铁血骑士→征服者→陨落者→红祭司'},
  {n:'力量',c:'战士',s:'战斗·黎明·守护',a:'科林·伊利亚特',h:'黄昏巨人',d:'战士途径。序列0「黄昏巨人」权柄为战斗、守护、力量。科林·伊利亚特为白银城首席，持「黄昏」之剑对抗黑暗。',q:'战士→格斗家→武器大师→黎明骑士→守护者→猎魔人→银骑士→荣耀者→神明之手→黄昏巨人'},
  {n:'隐者',c:'窥秘人',s:'神秘·召唤·预言',a:'嘉德丽雅',h:'隐者',d:'窥秘人途径。序列0「隐者」权柄为神秘、召唤、预言。嘉德丽雅为塔罗会「隐者」，强大的预言家，拥有罗塞尔后裔的重要线索。',q:'窥秘人→巫师→卷轴教授→星象师→召唤大师→神秘学家→预言大师→贤者→知识导师→隐者'},
  {n:'命运之轮',c:'怪物',s:'幸运·概率·混乱',a:'威尔·昂赛汀',h:'命运之轮',d:'怪物途径。序列0「命运之轮」权柄为幸运、概率、命运。威尔·昂赛汀为命运之蛇，掌控厄运与好运的平衡。',q:'怪物→折翼天使→幸运者→厄运法师→熵之法师→狂乱法师→命运先知→秩序阴影→天命→命运之轮'},
  {n:'正义',c:'观众',s:'读心·催眠·梦境',a:'奥黛丽·霍尔',h:'空想家',d:'观众途径。序列0「空想家」权柄为读心、催眠、梦境。奥黛丽·霍尔为塔罗会「正义」，最年轻的半神之一。',q:'观众→读心者→心理医生→催眠师→梦境行者→秘法师→洞察者→操纵师→编织者→空想家'},
  {n:'倒吊人',c:'秘祈人',s:'低语·献祭·隐秘',a:'真实造物主',h:'倒吊人',d:'秘祈人途径。序列0「倒吊人」权柄为低语、献祭、隐秘。真实造物主为隐秘存在，与亚当融合为远古太阳神。',q:'秘祈人→倾听者→隐修士→米粒拉之影→秘术导师→神秘学家→召唤大师→先知→圣母→倒吊人'},
  {n:'死神',c:'收尸人',s:'灵魂·亡灵·冥界',a:'阿兹克·艾格斯',h:'死神',d:'收尸人途径。序列0「死神」权柄为灵魂、亡灵、冥界。阿兹克·艾格斯为死神途径高序列强者，克莱恩的历史老师与好友。',q:'收尸人→掘墓人→亡语者→看门人→收割者→不死者→摆渡人→死亡执政官→凋零君王→死神'},
  {n:'节制',c:'囚犯',s:'疯狂·诅咒·枷锁',a:'莎伦',h:'被缚者',d:'囚犯途径。序列0「被缚者」权柄为疯狂、诅咒、封印。莎伦为节制派的代表人物，以极强的意志力对抗疯狂。',q:'囚犯→疯子→抑郁症患者→疯修士→沉默门徒→痛苦魔女→绝望魔女→矜持少女→破败之主→被缚者'},
  {n:'恶魔',c:'罪犯',s:'暴力·恶魔·深渊',a:'欲望母树',h:'深渊',d:'罪犯途径。序列0「深渊」权柄为暴力、恶魔、毁灭。欲望母树外神的力量延伸至该途径，是最凶险的序列之一。',q:'罪犯→杀手→冷血者→连环杀手→恶魔→魔鬼→深渊恶魔→鲜血大公→污秽君王→深渊'},
  {n:'塔',c:'阅读者',s:'知识·发明·推理',a:'艾德雯娜·爱德华兹',h:'白塔',d:'阅读者途径。序列0「白塔」权柄为知识、推理、预言。艾德雯娜·爱德华兹为「黄金梦想号」船长，知识与智慧之神的教会成员。',q:'阅读者→推理学员→守知者→博学者→秘术导师→预言家→贤者→全知之眼→天师→白塔'},
  {n:'星星',c:'不眠者',s:'黑夜·梦境·寂静',a:'伦纳德·米切尔',h:'黑暗',d:'不眠者途径。序列0「黑暗」权柄为黑夜、梦境、隐秘。伦纳德·米切尔为塔罗会「星星」，值夜者红手套队长，体内寄宿古老者帕列斯。',q:'不眠者→午夜诗人→梦魇→守夜人→收割者→不死者→摆渡人→沉默术士→恐惧之主→黑暗'},
  {n:'月亮',c:'药师',s:'魔药·吸血鬼·生命',a:'埃姆林·怀特',h:'月亮',d:'药师途径。序列0「月亮」权柄为魔药、吸血鬼、生命。埃姆林·怀特为塔罗会「月亮」，血族成员，性格傲娇但重情义。',q:'药师→驯兽师→吸血鬼→男爵→子爵→伯爵→侯爵→公爵→血族始祖→月亮'},
  {n:'太阳',c:'歌颂者',s:'光明·黎明·净化',a:'戴里克·伯格',h:'太阳',d:'歌颂者途径。序列0「太阳」权柄为光明、黎明、净化。戴里克·伯格为塔罗会「太阳」，来自神弃之地白银城的虔诚少年。',q:'歌颂者→祈光人→光之祭司→太阳神官→无暗者→光之天使→逐光者→银骑士→神明之手→太阳'},
  {n:'审判',c:'仲裁人',s:'律法·秩序·裁决',a:'休·迪尔查',h:'审判者',d:'仲裁人途径。序列0「审判者」权柄为律法、秩序、裁决。休·迪尔查为塔罗会「审判」，贝克兰德律法体系的守护者。',q:'仲裁人→调解人→治安官→法官→惩戒骑士→裁决者→律令法师→秩序之手→平衡者→审判者'},
  {n:'世界',c:'耕种者',s:'自然·丰收·大地',a:'弗兰克·李',h:'母亲',d:'耕种者途径。序列0「母亲」权柄为自然、丰收、生命。弗兰克·李为塔罗会「世界」，其疯狂实验令大地母神都感震惊。',q:'耕种者→医师→丰收祭司→生物学家→德鲁伊→自然行者→荒芜主母→森之妖精→自然使者→母亲'}
];

const CONFIG = {itemCount: D.length, starCount: 80, zGap: 550, loopSize: 0, camSpeed: 2.5};
CONFIG.loopSize = CONFIG.itemCount * CONFIG.zGap;
const BIG_TEXTS = ["诡秘","之主","非凡","途径","序列","命运","愚者","世界"];

const world = document.getElementById('world');
const viewport = document.getElementById('viewport');
const items = [];

function init() {
  // Create all pathway cards (22 cards, no skipping)
  for (let i = 0; i < CONFIG.itemCount; i++) {
    const el = document.createElement('div');
    el.className = 'item';
    const d = D[i];
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header"><span class="card-id">途径</span><div style="width:6px;height:6px;border:1px solid rgba(255,215,0,0.15)"></div></div>
      <div><h2>${d.n}</h2><div class="sub">${d.c}</div><div class="card-desc">${d.s}</div><div class="card-char">${d.a}</div></div>
      <div class="card-footer"><span>序列 9 → 0</span><span>LOTM</span></div>
      <div class="card-badge">${String(i+1).padStart(2,'0')}</div>`;
    el.appendChild(card);
    items.push({el, type:'card', x:(Math.random()-0.5)*250, y:(Math.random()-0.5)*150, rot:(Math.random()-0.5)*15, baseZ:-i * CONFIG.zGap});
    world.appendChild(el);
  }
  // Add big floating text as extra items between cards (not replacing any)
  for (let i = 0; i < BIG_TEXTS.length; i++) {
    const el = document.createElement('div');
    el.className = 'item';
    const txt = document.createElement('div');
    txt.className = 'big-text';
    txt.innerText = BIG_TEXTS[i];
    el.appendChild(txt);
    const zPos = -(i * CONFIG.zGap + CONFIG.zGap / 3); // intersperse between cards
    items.push({el, type:'text', x:0, y:0, rot:0, baseZ:zPos});
    world.appendChild(el);
  }
  for (let i = 0; i < CONFIG.starCount; i++) {
    const el = document.createElement('div');
    el.className = 'star';
    world.appendChild(el);
    items.push({el, type:'star', x:(Math.random()-0.5)*3000, y:(Math.random()-0.5)*3000, baseZ:-Math.random()*CONFIG.loopSize});
  }
}
init();

// Center 愚者 card on load
setTimeout(function() {
  var tr = document.getElementById('tarotTrack');
  if (tr) tr.scrollLeft = Math.max(0, 0 * 184 - tr.clientWidth / 2 + 92);
}, 100);

// Build infinite tarot gallery (3x duplication)
var ROMAN = ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];
var TOTAL = D.length; // 22
var CARD_W = 184; // card + gap
var track = document.getElementById('tarotTrack');

function buildTarot() {
  track.innerHTML = '';
  // Create 3 copies: before, center, after
  for (var copy = 0; copy < 3; copy++) {
    for (var i = 0; i < TOTAL; i++) {
      var d = D[i];
      var card = document.createElement('div');
      card.className = 'tcard';
      card.dataset.idx = i;
      card.innerHTML = '<div class="tci"><span class="tcn">' + ROMAN[i] + '</span><span class="tns">' + d.n + '</span><div class="tdv"></div><span class="tpt">' + d.c + '</span><span class="tds">' + d.a.split('·')[0].trim() + '<br>' + d.s.split('·').slice(0,2).join('·') + '</span><span class="tcn">' + ROMAN[i] + '</span></div>';
      // Click handler
      card.onclick = function() {
        var idx = parseInt(this.dataset.idx);
        // Center this card in gallery
        var tr = document.getElementById('tarotTrack');
        var baseScroll = TOTAL * CARD_W; // start of middle set
        tr.scrollTo({left: baseScroll + idx * CARD_W - tr.clientWidth / 2 + 87, behavior: 'smooth'});
        // Sync tunnel
        var ts = (idx * CONFIG.zGap) / CONFIG.camSpeed;
        var loops = Math.round(state.scroll / (CONFIG.loopSize / CONFIG.camSpeed));
        lenis.scrollTo(ts + loops * CONFIG.loopSize / CONFIG.camSpeed, {duration: 0.8});
      };
      // Double click for modal
      card.ondblclick = function() {
        openModal(parseInt(this.dataset.idx));
      };
      track.appendChild(card);
    }
  }
  // Start at middle set
  track.scrollLeft = TOTAL * CARD_W;
}
buildTarot();

// Infinite scroll reset - seamless jump back to center
var INFINITE_THRESHOLD = TOTAL * CARD_W;
track.addEventListener('scroll', function() {
  var maxScroll = track.scrollWidth - track.clientWidth;
  var midScroll = TOTAL * CARD_W;
  if (track.scrollLeft < INFINITE_THRESHOLD * 0.5) {
    // Near the beginning, jump to middle
    track.scrollLeft = midScroll + (track.scrollLeft % INFINITE_THRESHOLD);
  } else if (track.scrollLeft > maxScroll - INFINITE_THRESHOLD * 0.5) {
    // Near the end, jump back to middle
    track.scrollLeft = midScroll - (maxScroll - track.scrollLeft) % INFINITE_THRESHOLD;
  }
});

const lenis = new Lenis({smooth:true, lerp:0.08, direction:'vertical', gestureDirection:'vertical', smoothTouch:true});
lenis.on('scroll', ({scroll, velocity}) => {state.scroll = scroll; state.targetSpeed = velocity});

const state = {scroll:0, velocity:0, targetSpeed:0, mouseX:0, mouseY:0};
const fpsEl = document.getElementById('fps');
const coordEl = document.getElementById('coord');
let lastTime = 0;

window.addEventListener('mousemove', (e) => {state.mouseX = (e.clientX/innerWidth-0.5)*2; state.mouseY = (e.clientY/innerHeight-0.5)*2});

let tunnelIdx = -1;

function raf(time) {
  lenis.raf(time);
  const delta = time - lastTime; lastTime = time;
  if (time % 10 < 1) fpsEl.innerText = Math.round(1000/delta);
  state.velocity += (state.targetSpeed - state.velocity) * 0.1;
  
  const cameraZ = state.scroll * CONFIG.camSpeed;
  const tiltX = state.mouseY * 3 - state.velocity * 0.3;
  const tiltY = state.mouseX * 3;
  world.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
  
  const fov = 1000 - Math.min(Math.abs(state.velocity) * 8, 500);
  viewport.style.perspective = `${fov}px`;

  items.forEach(item => {
    let relZ = item.baseZ + cameraZ;
    const modC = CONFIG.loopSize;
    let vizZ = ((relZ % modC) + modC) % modC;
    if (vizZ > modC/2) vizZ -= modC;
    
    let alpha = 1;
    if (vizZ < -3000) alpha = 0;
    else if (vizZ < -2000) alpha = (vizZ + 3000) / 1000;
    if (vizZ > 100 && item.type !== 'star') alpha = 1 - ((vizZ - 100) / 400);
    if (alpha < 0) alpha = 0;
    item.el.style.opacity = alpha;
    
    let scale = 1;
    if (item.type !== 'star' && vizZ > 0) scale = 1 + (vizZ / 2000) * 0.3;
    
    if (alpha > 0) {
      let trans = `translate3d(${item.x}px, ${item.y}px, ${vizZ}px)`;
      if (item.type === 'star') {
        const stretch = Math.max(1, Math.min(1+Math.abs(state.velocity)*0.08, 8));
        trans += ` scale3d(1, 1, ${stretch})`;
      } else if (item.type === 'text') {
        trans += ` rotateZ(${item.rot}deg) scale(${scale})`;
        if (Math.abs(state.velocity) > 1.5) {
          const off = state.velocity * 1.5;
          item.el.style.textShadow = `${off}px 0 rgba(255,215,0,0.15), ${-off}px 0 rgba(180,180,220,0.15)`;
        } else item.el.style.textShadow = 'none';
      } else {
        const t = time * 0.001;
        trans += ` rotateZ(${item.rot}deg) rotateY(${Math.sin(t + item.x * 0.01) * 5}deg) scale(${scale})`;
      }
      item.el.style.transform = trans;
    }
  });

  const idx = Math.floor((state.scroll * CONFIG.camSpeed) / CONFIG.zGap) % D.length;
  coordEl.innerText = D[idx] ? D[idx].n + ' · ' + D[idx].c : '—';
  
  // Sync tunnel → tarot: highlight & scroll matching card
  if (idx !== tunnelIdx) {
    tunnelIdx = idx;
    var tr = document.getElementById('tarotTrack');
    if (tr) {
      var cs = tr.querySelectorAll('.tcard');
      for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('tactive', i === idx + TOTAL);
      tr.scrollLeft = TOTAL * CARD_W + idx * CARD_W - tr.clientWidth / 2 + 92;
    }
  }
  
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

// Arrow buttons - gallery only (no tunnel sync)
document.getElementById('tarotPrev').onclick = function() {
  var tr = document.getElementById('tarotTrack');
  tr.scrollBy({left: -CARD_W, behavior: 'smooth'});
};
document.getElementById('tarotNext').onclick = function() {
  var tr = document.getElementById('tarotTrack');
  tr.scrollBy({left: CARD_W, behavior: 'smooth'});
};
function syncTarotToTunnelReal() {
  var tr = document.getElementById('tarotTrack');
  var cx = tr.scrollLeft + tr.clientWidth / 2;
  var ci = Math.round(cx / 184);
  if (ci < 0) ci = 0;
  if (ci >= D.length) ci = D.length - 1;
  var ts = (ci * CONFIG.zGap) / CONFIG.camSpeed;
  var loops = Math.round(state.scroll / (CONFIG.loopSize / CONFIG.camSpeed));
  lenis.scrollTo(ts + loops * CONFIG.loopSize / CONFIG.camSpeed, {duration: 0.8});
}
// Click tunnel card → open detail modal
function openModal(i) {
  var d = D[i];
  document.getElementById('mTarot').textContent = '途径 ' + (i < 10 ? '0' : '') + i + ' · 塔罗牌「' + d.n + '」';
  document.getElementById('mTitle').textContent = d.n;
  document.getElementById('mSub').textContent = d.c + ' → ' + d.h;
  document.getElementById('mSeq9').textContent = d.c;
  document.getElementById('mSeq0').textContent = d.h;
  document.getElementById('mChar').textContent = d.a;
  document.getElementById('mCardNo').textContent = (i < 10 ? '0' : '') + i + ' / 21';
  document.getElementById('mDesc').textContent = d.d;
  var pathEl = document.getElementById('mSeqPath');
  var seqs = d.q.split('→');
  pathEl.innerHTML = seqs.map(function(s, j) {
    return '<span' + (j === 0 || j === seqs.length-1 ? ' class="hl"' : '') + '>' + s.trim() + '</span>';
  }).join('');
  document.getElementById('modal').classList.add('open');
}
// Close modal
document.getElementById('modalClose').onclick = function() {
  document.getElementById('modal').classList.remove('open');
};
document.getElementById('modal').onclick = function(e) {
  if (e.target === this) this.classList.remove('open');
};
// Make tunnel cards clickable
document.querySelectorAll('.viewport .card').forEach(function(card) {
  card.style.cursor = 'pointer';
  card.onclick = function() {
    // Find which index this card belongs to
    var h2 = this.querySelector('h2');
    if (!h2) return;
    var name = h2.textContent.trim();
    for (var i = 0; i < D.length; i++) {
      if (D[i].n === name) { openModal(i); break; }
    }
  };
});
</script>
</body>
</html>
