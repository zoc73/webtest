<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>非凡途径 — 诡秘之主</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:#07070d;color:#e8e4dc;height:2000vh;overflow-x:hidden}
#inv{position:fixed;inset:0;pointer-events:none;background:color-mix(in srgb,#fff 100%,transparent);mix-blend-mode:difference;z-index:100}
#gl1{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 0% 0%,rgba(255,189,56,0) 40%,rgba(255,189,56,0.40) 100%);mix-blend-mode:screen;opacity:0.15;z-index:99}
#gl2{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 100% 100%,rgba(180,120,50,0) 30%,rgba(180,120,50,0.35) 100%);mix-blend-mode:screen;opacity:0.12;z-index:98}
#vn{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.6) 100%);z-index:96}
#dots{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,215,0,0.025) 1px,transparent 1px);background-size:28px 28px;z-index:0}
canvas{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
#nc{mix-blend-mode:difference;opacity:0.065;z-index:101}
#gc{mix-blend-mode:overlay;opacity:0.04;z-index:98}
#pc{z-index:95;opacity:0.45}

/* ── Nav ── */
nav{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:rgba(7,7,13,0.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,215,0,0.06)}
nav a{font-family:'JetBrains Mono',monospace;font-size:0.65rem;letter-spacing:0.12rem;color:rgba(232,228,220,0.35);text-decoration:none;text-transform:uppercase;transition:color 0.2s}
nav a:hover{color:#FFD700}
nav .brand{font-weight:900;font-size:1rem;letter-spacing:-0.02em;mix-blend-mode:plus-lighter;color:#e8e4dc;text-decoration:none;font-family:'Noto Sans SC',sans-serif}

/* ── Scroll indicator ── */
.scroll-hint{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:90;text-align:center;font-family:'JetBrains Mono',monospace;font-size:0.55rem;letter-spacing:0.15rem;color:rgba(232,228,220,0.2);text-transform:uppercase;animation:scFade 2s ease-in-out infinite}
@keyframes scFade{0%,100%{opacity:0.3}50%{opacity:0.8}}
.scroll-hint svg{display:block;margin:0.3rem auto 0;animation:scBounce 1.5s ease-in-out infinite}
@keyframes scBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* ── Circular carousel ── */
@property --rotate { syntax: "<number>"; inherits: true; initial-value: 0; }

.carousel-body {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotate(calc(var(--rotate) * 360deg));
  width: 1px; height: 1px;
  animation: --page-rotate 1s linear;
  animation-timeline: scroll(nearest block);
  --cards: 22;
  animation-timing-function: steps(var(--cards));
}

@keyframes --page-rotate {
  to { --rotate: 1; }
}

.cwrap {
  --card-w: min(160px, 18vw);
  --card-h: calc(var(--card-w) * 7 / 5);
  --radius: calc(var(--card-w) * var(--cards) / (2 * 3.1416));
  position: absolute;
  top: 50%; left: 50%;
  width: 1px; height: 1px;
}

.ccard {
  --i: 0;
  --phase: calc((var(--i) - 1) / var(--cards) - 0.75);
  --pos: mod(calc(var(--phase) + var(--rotate) + 1), 1);
  --dist: min(var(--pos), calc(1 - var(--pos)));
  --blur: calc(clamp(0, var(--dist) / 0.12, 1) * 8px);
  --op: calc(1 - (var(--dist) / 0.15));
  --gray: clamp(0, calc(var(--dist) * var(--cards)), 1);
  
  position: absolute;
  top: 50%; left: 50%;
  width: var(--card-w);
  height: var(--card-h);
  offset-path: circle(var(--radius) at 0 0);
  offset-distance: calc((var(--i) - 1) / var(--cards) * 100%);
  offset-rotate: 0deg;
  border-radius: 10px;
  filter: blur(var(--blur)) grayscale(var(--gray));
  opacity: var(--op);
  transition: all 0.3s ease;
  transform-origin: center center;
  cursor: pointer;
}

.ccard:hover {
  filter: blur(0) grayscale(0) brightness(1.2);
  opacity: 1;
}

.ccard-inner {
  width: 100%; height: 100%;
  background: linear-gradient(180deg, #0c0c18, #07070d);
  border: 1px solid rgba(255,215,0,0.12);
  border-radius: 10px;
  padding: 0.7rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  position: relative;
  overflow: hidden;
}

.ccard-inner::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: 9px;
  border: 1px solid rgba(255,215,0,0.05);
  pointer-events: none;
}

.ccard-inner .num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  color: rgba(255,215,0,0.3);
}

.ccard-inner .name {
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  mix-blend-mode: plus-lighter;
  text-align: center;
  color: #e8e4dc;
}

.ccard-inner .divider {
  width: 50%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,215,0,0.12), transparent);
}

.ccard-inner .path {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.5rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,215,0,0.35);
  text-align: center;
}

.ccard-inner .desc {
  font-size: 0.5rem;
  color: rgba(232,228,220,0.25);
  text-align: center;
  line-height: 1.4;
  padding: 0 0.2rem;
}

/* Active card label */
.ccard .label {
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 0.7rem;
  color: #FFD700;
  mix-blend-mode: plus-lighter;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s;
}

.ccard:hover .label,
.ccard[data-active="true"] .label {
  opacity: 1;
}

.title-overlay {
  position: fixed;
  bottom: 15vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 89;
  text-align: center;
  pointer-events: none;
}

.title-overlay h2 {
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  mix-blend-mode: plus-lighter;
  color: #FFD700;
  opacity: 0.6;
}

.title-overlay p {
  font-size: 0.75rem;
  opacity: 0.25;
  font-family: 'JetBrains Mono', monospace;
  margin-top: 0.3rem;
  letter-spacing: 0.1em;
}

@supports not (animation-timeline: scroll()) {
  .carousel-body { display: none; }
  .fallback { display: block !important; }
}

.fallback { display: none; text-align: center; padding: 40vh 2rem; }
.fallback h2 { color: #FFD700; mix-blend-mode: plus-lighter; margin-bottom: 1rem; }
.fallback p { opacity: 0.4; font-size: 0.9rem; line-height: 1.8; }
</style>
</head>
<body>
<div id="inv"></div><div id="gl1"></div><div id="gl2"></div><div id="vn"></div><div id="dots"></div>
<canvas id="nc"></canvas><canvas id="gc"></canvas><canvas id="pc"></canvas>

<nav>
  <a href="../index.html" class="brand">诡秘之主</a>
  <div style="display:flex;gap:1.5rem">
    <a href="../index.html">首页</a>
    <a href="characters.html">角色</a>
    <a href="pathways.html" style="color:#e8e4dc">途径</a>
    <a href="artifacts.html">封印物</a>
  </div>
</nav>

<div class="carousel-body">
  <div class="cwrap">
    <!-- 22 tarot cards generated by JS -->
  </div>
</div>

<div class="title-overlay">
  <h2>22 条非凡途径</h2>
  <p>scroll to explore · 滚动浏览</p>
</div>

<div class="scroll-hint">
  滚动探索
  <svg width="16" height="24" viewBox="0 0 16 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="1" y="1" width="14" height="22" rx="7"/>
    <circle cx="8" cy="7" r="2" fill="currentColor"/>
  </svg>
</div>

<div class="fallback">
  <h2>22 条非凡途径</h2>
  <p>您的浏览器不支持滚动驱动动画<br>请使用 Chrome 115+ 或 Edge 115+</p>
</div>

<script>
// Generate 22 pathway cards
var pathways = [
  {num:'0', name:'愚者', path:'占卜家', desc:'占卜·秘偶·时之虫', detail:'克莱恩·莫雷蒂'},
  {num:'I', name:'魔法师', path:'偷盗者', desc:'窃取·寄生·时之虫', detail:'阿蒙'},
  {num:'XXI', name:'世界', path:'学徒', desc:'传送·空间·门', detail:'诡秘三途径'},
  {num:'VIII', name:'正义', path:'观众', desc:'读心·催眠·梦境', detail:'奥黛丽·霍尔'},
  {num:'XI', name:'力量', path:'战士', desc:'战斗·黎明·守护', detail:'守护之路'},
  {num:'XVIII', name:'月亮', path:'不眠者', desc:'黑夜·梦境·寂静', detail:'伦纳德·米切尔'},
  {num:'XV', name:'恶魔', path:'秘祈人', desc:'低语·献祭·隐秘', detail:'禁忌之路'},
  {num:'VII', name:'战车', path:'水手', desc:'风暴·海洋·雷霆', detail:'阿尔杰·威尔逊'},
  {num:'V', name:'教皇', path:'通识者', desc:'知识·机械·蒸汽', detail:'蒸汽教会'},
  {num:'X', name:'命运之轮', path:'怪物', desc:'幸运·概率·混乱', detail:'命运的宠儿'},
  {num:'III', name:'女皇', path:'药师', desc:'魔药·吸血鬼·生命', detail:'血族'},
  {num:'IV', name:'皇帝', path:'耕种者', desc:'自然·丰收·大地', detail:'生命途径'},
  {num:'XIII', name:'死神', path:'收尸人', desc:'灵魂·亡灵·冥界', detail:'死亡领域'},
  {num:'XX', name:'审判', path:'仲裁人', desc:'律法·秩序·裁决', detail:'正义之路'},
  {num:'IV', name:'皇帝', path:'律师', desc:'规则·阴谋·独裁', detail:'罗塞尔'},
  {num:'XVI', name:'高塔', path:'囚犯', desc:'疯狂·诅咒·枷锁', detail:'挣脱之路'},
  {num:'XII', name:'倒吊人', path:'猎人', desc:'火焰·战争·征服', detail:'红祭司'},
  {num:'II', name:'女祭司', path:'刺客', desc:'毒药·女巫·魅惑', detail:'暗影杀手'},
  {num:'IX', name:'隐者', path:'窥秘人', desc:'神秘·召唤·预言', detail:'求知之路'},
  {num:'XIX', name:'太阳', path:'太阳', desc:'光明·黎明·净化', detail:'戴里克·伯格'},
  {num:'XVII', name:'星星', path:'窥秘人', desc:'知识·发明·进步', detail:'科学之路'},
  {num:'VI', name:'恋人', path:'罪犯', desc:'暴力·恶魔·深渊', detail:'混沌之源'}
];

var container = document.querySelector('.cwrap');
for (var i = 0; i < pathways.length; i++) {
  var p = pathways[i];
  var card = document.createElement('div');
  card.className = 'ccard';
  card.style.setProperty('--i', i + 1);
  card.innerHTML = 
    '<div class="ccard-inner">' +
      '<span class="num">' + p.num + '</span>' +
      '<span class="name">' + p.name + '</span>' +
      '<div class="divider"></div>' +
      '<span class="path">' + p.path + '</span>' +
      '<span class="desc">' + p.desc + '<br>' + p.detail + '</span>' +
      '<span class="num" style="align-self:flex-end">' + p.num + '</span>' +
    '</div>' +
    '<span class="label">' + p.name + ' · ' + p.path + '</span>';
  container.appendChild(card);
}

// Canvas
(function(){function C(id){var c=document.getElementById(id);if(!c)return;c.width=window.innerWidth;c.height=window.innerHeight;return c}
var nc=C('nc');setInterval(function(){if(!nc)return;var w=nc.width,h=nc.height,d=nc.getContext('2d').createImageData(w,h),b=d.data;for(var i=0;i<b.length;i+=4){b[i]=Math.random()*255;b[i+1]=b[i];b[i+2]=b[i];b[i+3]=255}nc.getContext('2d').putImageData(d,0,0)},100);
var gc2=C('gc');setInterval(function(){if(!gc2)return;var w=gc2.width,h=gc2.height,d=gc2.getContext('2d').createImageData(w,h),b=d.data;for(var i=0;i<b.length;i+=4){b[i]=Math.random()*40+10;b[i+1]=b[i]*0.9;b[i+2]=b[i]*0.7;b[i+3]=25}gc2.getContext('2d').putImageData(d,0,0)},200);
var pc2=C('pc');var pts=[];!function(){if(!pc2)return;var w=pc2.width=window.innerWidth,h=pc2.height=window.innerHeight;for(var i=0;i<60;i++)pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.2,vy:(Math.random()-0.5)*0.2,s:Math.random()*1.5+0.3,a:Math.random()*0.3+0.05})}();
!function dp(){if(!pc2)return;var w=pc2.width,h=pc2.height,ctx=pc2.getContext('2d');ctx.clearRect(0,0,w,h);for(var i=0;i<pts.length;i++){var p=pts[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fillStyle='rgba(255,215,0,'+p.a+')';ctx.fill()}requestAnimationFrame(dp)}();
})();
</script>
</body>
</html>
