#glow2{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at 100% 100%,rgba(180,120,50,0) 30%,rgba(180,120,50,0.35) 100%);mix-blend-mode:screen;opacity:0.12;z-index:98}

#dots{pointer-events:none;position:fixed;inset:0;background-image:radial-gradient(rgba(255,215,0,0.025) 1px,transparent 1px);background-size:28px 28px;z-index:0}
#grain-c{pointer-events:none;position:fixed;inset:0;mix-blend-mode:overlay;opacity:0.04;z-index:98}
#tex-c{pointer-events:none;position:fixed;inset:0;mix-blend-mode:color-dodge;opacity:0.025;z-index:97}
#pt-c{pointer-events:none;position:fixed;inset:0;z-index:95;opacity:0.45}
main{position:relative;z-index:2;max-width:1600px;margin:0 auto;padding:2rem}
.logo-text{font-weight:900;font-size:2.625rem;line-height:1;letter-spacing:0.0525rem;mix-blend-mode:plus-lighter;color:#e8e4dc;display:block;transition:text-shadow 0.3s;text-decoration:none}

.nav-link{font-family:'Noto Serif SC',serif;font-size:0.85rem;letter-spacing:0.2rem;color:#e8e4dc;text-decoration:none;text-transform:uppercase;position:relative;transition:all 0.3s;opacity:0.55;display:inline-block}
.nav-link::after{content:'';position:absolute;bottom:-2px;left:50%;width:0;height:1px;background:#FFD700;transition:all 0.3s}
.nav-link:hover{opacity:1}
.nav-link:hover::after{left:0;width:100%}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes fsi{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fu{to{opacity:1;transform:translateY(0)}}
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:0;border-left:1px solid rgba(255,215,0,0.06);border-right:1px solid rgba(255,215,0,0.06)}
.gc{border-right:1px solid rgba(255,215,0,0.06);border-bottom:1px solid rgba(255,215,0,0.06);padding:1rem;transition:border-color 0.3s}
.gc:last-child{border-right:none}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5.5rem 1rem 4.5rem;gap:1.5rem;position:relative}
.hero::before{content:'';position:absolute;top:-20%;left:-10%;right:-10%;bottom:-20%;background:radial-gradient(ellipse at 50% 30%,rgba(255,215,0,0.03) 0%,transparent 60%);animation:hp 4s ease-in-out infinite;pointer-events:none;z-index:-1}
@keyframes hp{0%,100%{opacity:0.5;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.hero-sub{font-family:'Noto Serif SC',serif;font-size:0.85rem;letter-spacing:0.35rem;opacity:0.5;text-transform:uppercase;font-weight:300;animation:fsi 1s ease-out}

.hero-title .sub{display:block;margin-top:0.08em;font-size:0.45em;font-weight:300;opacity:0.2;letter-spacing:0.15em}
.section-title{font-size:1rem;font-weight:700;mix-blend-mode:plus-lighter;margin-bottom:0.6rem;letter-spacing:0.05em;font-family:'Noto Serif SC',serif}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid rgba(255,215,0,0.06)}
.info-item{padding:0.85rem;border-right:1px solid rgba(255,215,0,0.06);border-bottom:1px solid rgba(255,215,0,0.06)}
.info-item:nth-child(4n){border-right:none}

.info-label{font-family:'JetBrains Mono',monospace;font-size:0.5rem;color:rgba(255,215,0,0.3);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.25rem}
.info-value{font-size:0.85rem;color:rgba(232,228,220,0.7);line-height:1.5;font-weight:300}
.desc-box{padding:1.5rem;background:rgba(255,215,0,0.01);border-left:3px solid rgba(255,215,0,0.12);margin:0;font-size:0.9rem;line-height:2;color:rgba(232,228,220,0.5)}
.related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid rgba(255,215,0,0.06)}
.rel-item{position:relative;padding:1rem;border-right:1px solid rgba(255,215,0,0.06);border-bottom:1px solid rgba(255,215,0,0.06);cursor:pointer;transition:all 0.3s}
.rel-item:nth-child(4n){border-right:none}
.rel-item:hover{background:rgba(255,215,0,0.015);transform:translateY(-2px)}
.rel-item:hover .rel-name{color:#FFD700}
.rel-name{font-size:0.9rem;font-weight:600;mix-blend-mode:plus-lighter;transition:color 0.3s}
.rel-title{font-size:0.65rem;color:rgba(255,215,0,0.3);font-family:'JetBrains Mono',monospace;letter-spacing:0.1em;margin-top:0.1rem}
.rel-bio{font-size:0.72rem;color:rgba(232,228,220,0.35);line-height:1.5;margin-top:0.25rem}
.fade{opacity:0;transform:translateY(14px);animation:fu 0.7s ease-out forwards}
.fd1{animation-delay:0.15s}.fd2{animation-delay:0.3s}.fd3{animation-delay:0.45s}.fd4{animation-delay:0.6s}.fd5{animation-delay:0.75s}.fd6{animation-delay:0.9s}
nav{display:flex;align-items:center;justify-content:space-between;padding:0 0 1rem;border-bottom:1px solid rgba(255,215,0,0.08);margin-bottom:2rem}
@media(max-width:768px){
  main{padding:1rem}
  .info-grid{grid-template-columns:repeat(2,1fr)}
  .info-item:nth-child(4n){border-right:1px solid rgba(255,215,0,0.06)}
  .info-item:nth-child(2n){border-right:none}
  .related-grid{grid-template-columns:repeat(2,1fr)}

  .rel-item:nth-child(2n){border-right:none}
  .hero{padding:3rem 0.5rem 2rem}
  .hero-title{font-size:clamp(2rem,8vw,3rem)}
}
@media(max-width:480px){
  .info-grid,.related-grid{grid-template-columns:1fr}

  .rel-item:nth-child(2n){border-right:1px solid rgba(255,215,0,0.06)}
  nav{flex-direction:column;gap:0.5rem}
}

<script>
// Canvas rendering (matching original site style)
function initCanvas(id){
  const c=document.getElementById(id);
  if(!c)return;
  const ctx=c.getContext('2d');
  function r(){c.width=window.innerWidth;c.height=window.innerHeight}
  r();
  window.addEventListener('resize',r);
  return{c,ctx,r}
}
// Noise layer
initCanvas('grain-c');
setInterval(()=>{
  const c=document.getElementById('grain-c');
  if(!c)return;
  const w=c.width,h=c.height,id=c.getContext('2d').createImageData(w,h),b=id.data;
  for(let i=0;i<b.length;i+=4){b[i]=Math.random()*40+10;b[i+1]=b[i]*0.9;b[i+2]=b[i]*0.7;b[i+3]=25}
  c.getContext('2d').putImageData(id,0,0)
},200);
// Texture
initCanvas('tex-c');
(function(){
  const c=document.getElementById('tex-c');
  if(!c)return;
  const ctx=c.getContext('2d'),w=c.width,h=c.height;
  const id=ctx.createImageData(w,h),b=id.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4,p=(Math.sin(x*0.05)+Math.sin(y*0.05))*15+128,n=Math.random()*8-4;
    b[i]=p+n;b[i+1]=p*0.8+n;b[i+2]=p*0.5+n;b[i+3]=15
  }
  ctx.putImageData(id,0,0)
})();
// Particles
const ptc=document.getElementById('pt-c'),ptctx=ptc.getContext('2d');
let pw=0,ph=0,pts=[];
function pr(){
  pw=ptc.width=window.innerWidth;
  ph=ptc.height=window.innerHeight;
  pts=[];
  for(let i=0;i<80;i++)pts.push({x:Math.random()*pw,y:Math.random()*ph,vx:(Math.random()-0.5)*0.25,vy:(Math.random()-0.5)*0.25,s:Math.random()*1.8+0.3,a:Math.random()*0.35+0.08})
}
pr();
window.addEventListener('resize',pr);
(function dp(){
  ptctx.clearRect(0,0,pw,ph);
  for(const p of pts){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=pw;if(p.x>pw)p.x=0;
    if(p.y<0)p.y=ph;if(p.y>ph)p.y=0;
    ptctx.beginPath();
    ptctx.arc(p.x,p.y,p.s,0,Math.PI*2);
    ptctx.fillStyle=`rgba(255,215,0,${p.a})`;
    ptctx.fill()
  }
  requestAnimationFrame(dp)
})();
// Intersection observer for fade-in
(function(){
  const ob=new IntersectionObserver(e=>{e.forEach(e=>{if(e.isIntersecting&&e.target.style.animationPlayState!=='running')e.target.style.animationPlayState='running'})},{threshold:0.08});
  document.querySelectorAll('.fade').forEach(e=>{e.style.animationPlayState='paused';ob.observe(e)})
})();

// ====== CHARACTER DATA ======
var CHARS = {
  '克莱恩·莫雷蒂': {n:'克莱恩·莫雷蒂',t:'「世界」· 愚者',p:'占卜家途径',s:'序列0 愚者',c:'塔罗会创立者 · 值夜者',d:'本名周明瑞，现代人穿越至鲁恩王国廷根市，成为克莱恩·莫雷蒂。原霍伊大学历史系毕业生，后加入值夜者。在"转运仪式"中意外进入源堡，伪装成复苏的"愚者"建立塔罗会。通过扮演法消化魔药，一路从序列9晋升至序列0。拥有格尔曼·斯帕罗（疯狂冒险家）、夏洛克·莫里亚蒂（私家侦探）、道恩·唐泰斯（富豪）、梅林·赫尔墨斯（奇迹师）等著名身份。最终以永恒的沉睡容纳源堡，成为诡秘之主，守护世界的屏障。'},
  '伦纳德·米切尔': {n:'伦纳德·米切尔',t:'「星星」',p:'不眠者途径',s:'序列3 恐惧主教',c:'值夜者红手套队长 · 塔罗会',d:'克莱恩在值夜者的好友与搭档。诗人气质，幽默风趣。体内寄宿着古老者帕列斯·索罗亚斯德（错误途径序列1「时之虫」），被称为"老头"。在帕列斯的指导下晋升非凡，后加入红手套并成为队长。塔罗会「星星」。'},
  '奥黛丽·霍尔': {n:'奥黛丽·霍尔',t:'「正义」',p:'观众途径',s:'序列3 织梦人',c:'霍尔伯爵千金 · 塔罗会',d:'塔罗会第一位成员，贝克兰德最富有家族的千金小姐。观众途径非凡者，善良勇敢、求知欲旺盛。在克莱恩的指引下学会了扮演法，逐步晋升。最大的愿望是帮助他人，被称为"最年轻的半神"。曾多次在关键事件中发挥作用，包括解决贝克兰德大雾霾事件。'},
  '阿尔杰·威尔逊': {n:'阿尔杰·威尔逊',t:'「教皇」',p:'水手途径（暴君）',s:'序列4 灾难主祭',c:'海上冒险家 · 塔罗会',d:'暴君途径非凡者，塔罗会「教皇」，也是最早加入塔罗会的成员之一。游历七海见识广博，是塔罗会最重要的情报来源。从普通的船上水手一步步成长为半神，在海上享有盛名。'},
  '佛尔思·沃尔': {n:'佛尔思·沃尔',t:'「魔术师」',p:'学徒途径（门）',s:'序列3 漫游者',c:'畅销小说作家 · 塔罗会',d:'学徒途径非凡者，塔罗会「魔术师」。身份为畅销小说作家，写有《大冒险家》等作品。性格懒散但天赋极高，与好友休·迪尔查一同被克莱恩招募加入塔罗会。在克莱恩的指引下快速成长，掌握了传送与记录等空间能力。'},
  '休·迪尔查': {n:'休·迪尔查',t:'「审判」',p:'仲裁人途径（审判者）',s:'序列4 律令法师',c:'军情九处 · 塔罗会',d:'仲裁人途径非凡者，塔罗会「审判」。出生于贵族家庭，因家族变故流落底层。身材矮小但战斗力极强，在贝克兰德律法体系中有很深的人脉。月之源酒吧的常客，与佛尔思是最好的朋友。'},
  '戴里克·伯格': {n:'戴里克·伯格',t:'「太阳」',p:'歌颂者途径（太阳）',s:'序列4 无暗者',c:'白银城 · 塔罗会',d:'来自神弃之地白银城的虔诚少年。太阳途径非凡者，塔罗会「太阳」。在愚者的指引下学会了扮演法，逐步晋升。性格虔诚正直、勇敢坚定，是愚者最忠实的信徒之一。在回到白银城后，成为对抗黑暗的中坚力量。'},
  '埃姆林·怀特': {n:'埃姆林·怀特',t:'「月亮」',p:'药师途径（月亮）',s:'序列4 巫王',c:'血族 · 塔罗会',d:'血族成员，药师途径非凡者，塔罗会「月亮」。性格傲娇自负、中二搞笑但重情重义。在塔罗会中不断成长，从最初的"血族至上"到后来真正融入团队。对血族历史和文化有深入研究。'},
  '嘉德丽雅': {n:'嘉德丽雅',t:'「隐者」',p:'窥秘人途径（隐者）',s:'序列3 预言大师',c:'星之上将 · 塔罗会',d:'窥秘人途径非凡者，塔罗会「隐者」。原为隐秘组织「摩斯苦修会」成员，后成为独立冒险家。强大的预言家，拥有罗塞尔后裔的重要线索。在迷雾海享有盛名，被称为"星之上将"。'},
  '阿蒙': {n:'阿蒙',t:'时之虫 · 错误',p:'偷盗者途径（错误）',s:'序列0 错误',c:'远古太阳神之子',d:'远古太阳神之子，错误途径天使之王。戴着标志性的尖顶软帽，喜欢以单片眼镜象征自己的身份。以窃取他人命运和能力为乐，善于布局谋划。与克莱恩争夺源堡的宿命对手，多次在关键事件中与克莱恩交锋。性格恶趣味、狡诈多智，是全书最富魅力的反派之一。'},
  '罗塞尔·古斯塔夫': {n:'罗塞尔·古斯塔夫',t:'黑皇帝',p:'律师途径（黑皇帝）',s:'序列0 黑皇帝',c:'穿越者 · 日不落帝国建立者',d:'穿越者前辈，大约一千年前穿越至这个世界。建立了横跨大陆的"日不落帝国"，推动了蒸汽革命。利用汉字在日记中留下关键线索，指引后来的穿越者（克莱恩）。黑皇帝途径序列0真神，但因非凡特性失控而扭曲，灵魂被污染。他的日记是克莱恩最重要的信息来源。女儿贝尔纳黛继承了其一部分遗产。'},
  '贝尔纳黛·古斯塔夫': {n:'贝尔纳黛·古斯塔夫',t:'「谜题女士」',p:'通识者途径（完美者）',s:'序列3 奥秘学者',c:'迷雾海冒险家 · 神秘女王',d:'迷雾海最强大的冒险家之一，被称为"神秘女王"。罗塞尔·古斯塔夫之女，继承了罗塞尔众多的秘密与遗产。通识者途径非凡者，持有大量古代知识和非凡物品。游历五海收集父亲留下的线索，与克莱恩多次相遇并合作。'},
  '阿兹克·艾格斯': {n:'阿兹克·艾格斯',t:'死神',p:'收尸人途径（死神）',s:'序列1 凋零君王',c:'历史系教授 · 死神信使',d:'死神途径序列1「凋零君王」级别的强者，但记忆被封印，以历史系教授的身份生活。曾是远古死神座下的天使。与克莱恩建立了深厚的师生情谊，多次在关键时刻出手相助。灵魂与死神途径的权柄有深刻联系，信封上的火焰是其特征标志。'},
  '特莉丝': {n:'特莉丝',t:'女巫',p:'刺客途径（魔女）',s:'序列4 绝望魔女',c:'魔女教派',d:'刺客途径非凡者，经历了从序列7开始性别转换。魔女教派成员，在贝克兰德大雾霾事件中扮演了重要角色。序列4「绝望魔女」，掌握魅惑、痛苦与绝望之力。'},
  '威尔·昂赛汀': {n:'威尔·昂赛汀',t:'命运之蛇',p:'怪物途径（命运之轮）',s:'序列1 水银之蛇',c:'命运化身',d:'怪物途径序列1「水银之蛇」（衔尾蛇）。本体是一条水银色的巨蛇，但常以小男孩的形象出现。掌控好运与厄运的平衡，致力于维护命运的正常流转。曾多次在关键时刻"巧合地"帮助克莱恩，比如赠送"好运符"、在源堡之战中出手相助。被称为"威尔亲王"。'},
  '莎伦': {n:'莎伦',t:'节制派',p:'囚犯途径（被缚者）',s:'序列4 木偶',c:'节制派异种',d:'囚犯途径非凡者，节制派的代表人物。与马里奇一起行动，以极强的意志力对抗异种本能中的嗜血欲望和诅咒。外表为优雅的贵族小姐装扮，实为木偶形态。在黑市和非凡者圈子里很有名。'},
  '马里奇': {n:'马里奇',t:'节制派',p:'囚犯途径（被缚者）',s:'序列5 怨魂',c:'节制派异种',d:'囚犯途径非凡者，节制派成员。与莎伦搭档行动。以极强的意志力压制异种的嗜血欲望，在黑市从事赏金猎人等工作。与克莱恩在贝克兰德相识，多次合作。'},
  '帕列斯·索罗亚斯德': {n:'帕列斯·索罗亚斯德',t:'「古老者」',p:'偷盗者途径（错误）',s:'序列1 时之虫',c:'索罗亚斯德家族先祖',d:'古老的偷盗者途径序列1「时之虫」，索罗亚斯德家族的先祖。因重伤寄生在伦纳德·米切尔体内，被伦纳德称为"老头"。积累了上千年的知识和经验，是伦纳德的导师与金手指。虽然表面上只关心自己，但实际上对伦纳德有很深的感情。'},
  '亚当': {n:'亚当',t:'空想家',p:'观众途径（空想家）',s:'序列0 空想家',c:'远古太阳神之子 · 黄昏隐士会',d:'观众途径序列0真神。表面身份为神秘组织「黄昏隐士会」的首领、阿蒙的兄弟。实际上是远古太阳神的一部分，与真实造物主同源。在全书后期与真实造物主融合，重新成为远古太阳神。计划宏大，以千年为单位布局。'},
  '梅迪奇': {n:'梅迪奇',t:'战争之红',p:'猎人途径（红祭司）',s:'序列1 征服者',c:'原天使之王',d:'远古太阳神座下天使之王，猎人途径序列1「征服者」。被称为"战争之红"或"红天使"。性格狂妄嚣张、睚眦必报。在远古太阳神陨落后被封印，后与索伦、艾因霍恩的残留意识融合。对阿蒙和亚当都有强烈的敌意，却意外成了克莱恩的盟友。'},
  '科林·伊利亚特': {n:'科林·伊利亚特',t:'白银城首席',p:'战士途径（黄昏巨人）',s:'序列3 银骑士',c:'白银城首席',d:'神弃之地白银城的首席，战士途径序列3「银骑士」。持传说级封印物「黄昏」之剑，领导白银城民众在黑暗中艰难求生数十年。性格坚毅果敢，是白银城的精神支柱。在见证了克莱恩的力量后，选择信仰愚者以拯救白银城，最终牺牲自己为白银城争取了时间和希望。'},
  '艾德雯娜·爱德华兹': {n:'艾德雯娜·爱德华兹',t:'「黄金梦想号」船长',p:'阅读者途径（白塔）',s:'序列4 预言家',c:'知识与智慧之神的教会',d:'「黄金梦想号」船长，阅读者途径非凡者。知识与智慧之神的教徒，智慧与美貌并重。在海上冒险家中享有盛名，以其卓越的航海技术和丰富的知识著称。达尼兹的暗恋对象。'},
  '弗兰克·李': {n:'弗兰克·李',t:'「世界」',p:'耕种者途径（母亲）',s:'序列5 德鲁伊',c:'塔罗会 · 原血之上校',d:'塔罗会「世界」，耕种者途径非凡者。原为玫瑰学派的血之上校，后通过魔药更换转入耕种者途径。其疯狂实验令人瞠目结舌：制造"蘑菇人"、"啤酒花母羊"、"会说话的奶牛"等，连大地母神都对他的创造力感到震惊。性格单纯，专注于生命创造研究。'},
  '达尼兹': {n:'达尼兹',t:'「大冒险家」',p:'猎人途径（红祭司）',s:'序列6 阴谋家',c:'格尔曼的跟班',d:'原为海上冒险家，在遇到格尔曼·斯帕罗（克莱恩的马甲）后成了他的跟班。性格贪生怕死但又重情义，典型的"嘴上说不要身体很诚实"。多次在格尔曼的冒险中扮演助手角色，意外地活到了最后。暗恋艾德雯娜船长。'},
  '艾辛格·斯坦': {n:'艾辛格·斯坦',t:'「星之杖」',p:'观众途径',s:'序列5 梦境行者',c:'神秘学专家',d:'贝克兰德著名的私家侦探兼神秘学家。原是观众途径非凡者，因为一次失败的计划失败后丢失部分非凡特性，降至低序列。与克莱恩（夏洛克·莫雷蒂身份）合作调查贝克兰德的多起神秘案件，是克莱恩早期的盟友之一。'},
  '真实造物主': {n:'真实造物主',t:'倒吊人',p:'秘祈人途径（倒吊人）',s:'序列0 倒吊人',c:'隐秘存在 · 极光会信仰',d:'秘祈人途径序列0真神，隐秘存在。极光会所信奉的神明，也被称为"真实造物主"、"创造者"。实际上是远古太阳神分裂出的负面部分。在全书后期与亚当融合，重新成为完整的远古太阳神。其力量充满堕落与牺牲的特性，聆听祂低语的人容易疯狂。'},
  '欲望母树': {n:'欲望母树',t:'外神',p:'罪犯途径（深渊）',s:'外神',c:'源自外神',d:'源自宇宙外神的存在，其力量延伸至罪犯途径（深渊途径）。是《诡秘之主》世界中最凶险的外神之一，影响着深渊途径的非凡者。其力量充满暴力、恶魔与毁灭的权柄。'}
};
var RELATED = {
  '克莱恩·莫雷蒂': ['伦纳德·米切尔','奥黛丽·霍尔','阿兹克·艾格斯','罗塞尔·古斯塔夫','阿蒙','帕列斯·索罗亚斯德','威尔·昂赛汀','达尼兹'],
  '伦纳德·米切尔': ['克莱恩·莫雷蒂','帕列斯·索罗亚斯德','奥黛丽·霍尔'],
  '奥黛丽·霍尔': ['克莱恩·莫雷蒂','阿尔杰·威尔逊','戴里克·伯格','佛尔思·沃尔','休·迪尔查'],
  '阿尔杰·威尔逊': ['克莱恩·莫雷蒂','奥黛丽·霍尔','嘉德丽雅'],
  '佛尔思·沃尔': ['休·迪尔查','克莱恩·莫雷蒂'],
  '休·迪尔查': ['佛尔思·沃尔','克莱恩·莫雷蒂'],
  '戴里克·伯格': ['克莱恩·莫雷蒂','奥黛丽·霍尔','科林·伊利亚特'],
  '埃姆林·怀特': ['克莱恩·莫雷蒂','奥黛丽·霍尔'],
  '嘉德丽雅': ['克莱恩·莫雷蒂','贝尔纳黛·古斯塔夫'],
  '阿蒙': ['克莱恩·莫雷蒂','亚当','帕列斯·索罗亚斯德'],
  '罗塞尔·古斯塔夫': ['克莱恩·莫雷蒂','贝尔纳黛·古斯塔夫'],
  '贝尔纳黛·古斯塔夫': ['罗塞尔·古斯塔夫','克莱恩·莫雷蒂','嘉德丽雅'],
  '阿兹克·艾格斯': ['克莱恩·莫雷蒂'],
  '特莉丝': [],
  '威尔·昂赛汀': ['克莱恩·莫雷蒂'],
  '莎伦': ['马里奇','克莱恩·莫雷蒂'],
  '马里奇': ['莎伦','克莱恩·莫雷蒂'],
  '帕列斯·索罗亚斯德': ['伦纳德·米切尔','阿蒙'],
  '亚当': ['阿蒙','真实造物主'],
  '梅迪奇': ['克莱恩·莫雷蒂','阿蒙'],
  '科林·伊利亚特': ['戴里克·伯格'],
  '艾德雯娜·爱德华兹': ['达尼兹'],
  '弗兰克·李': [],
  '达尼兹': ['克莱恩·莫雷蒂','艾德雯娜·爱德华兹'],
  '艾辛格·斯坦': ['克莱恩·莫雷蒂'],
  '真实造物主': ['亚当'],
  '欲望母树': []
};

// Render character
var name = new URLSearchParams(window.location.search).get('name');
if (!name || !CHARS[name]) name = '克莱恩·莫雷蒂';
var c = CHARS[name];
document.title = c.n + ' · 诡秘之主';
document.getElementById('charHeroSub').textContent = '角色档案';
document.getElementById('charTitle').innerHTML = c.n + '<span class="sub" id="charSub">' + c.t + '</span>';
document.getElementById('charSub').textContent = '';
var infoHtml = '';
[
  ['称号/身份', c.t],
  ['途径', c.p],
  ['序列等级', c.s],
  ['所属组织', c.c || '—']
].forEach(function(item) {
  infoHtml += '<div class="info-item"><div class="info-label">' + item[0] + '</div><div class="info-value">' + item[1] + '</div></div>';
});
document.getElementById('infoGrid').innerHTML = infoHtml;
document.getElementById('charDesc').textContent = c.d;

// Related characters
var rels = RELATED[name] || [];
var relHtml = '';
if (rels.length > 0) {
  rels.forEach(function(rn, i) {
    var rc = CHARS[rn];
    if (rc) {
      var delay = (i % 6) + 1;
      relHtml += '<div class="rel-item fade fd' + delay + '" onclick="location.href=\'character.html?name=' + encodeURIComponent(rn) + '\'"><div class="rel-name">' + rc.n + '</div><div class="rel-title">' + rc.t + '</div><div class="rel-bio">' + (rc.d ? rc.d.substring(0, 80) + '…' : '') + '</div></div>';
    }
  });
} else {
  relHtml += '<div class="rel-item" style="grid-column:1/-1;text-align:center;opacity:0.3">暂无相关人物</div>';
}
document.getElementById('relatedGrid').innerHTML = relHtml;

// Re-run observer for new fade elements
setTimeout(function() {
  var ob = new IntersectionObserver(function(e){e.forEach(function(e){if(e.isIntersecting&&e.target.style.animationPlayState!=='running')e.target.style.animationPlayState='running'})},{threshold:0.08});
  document.querySelectorAll('#relatedGrid .fade').forEach(function(e){e.style.animationPlayState='paused';ob.observe(e)});
}, 100);
</script>
<script>
gsap.registerPlugin(ScrollTrigger);
const heroTl = gsap.timeline({ defaults: { ease: 'power3.out' } });
heroTl.fromTo('#glow', { opacity: 0 }, { opacity: 0.15, duration: 1.2 }, 0);
heroTl.fromTo('#glow2', { opacity: 0 }, { opacity: 0.12, duration: 1.5 }, 0.3);
heroTl.from('.hero-sub', { y: -30, opacity: 0, duration: 0.9 }, 0.2);
const titleEl = document.querySelector('.hero-title'); if (titleEl) { const mainText = titleEl.childNodes[0] ? (titleEl.childNodes[0].textContent || '').trim() : ''; const subHtml = titleEl.querySelector('.sub') ? titleEl.querySelector('.sub').outerHTML : ''; const mainChars = mainText.split('').map(c => c === ' ' ? ' ' : `<span class="gsap-char">${c}</span>`).join(''); titleEl.innerHTML = mainChars + subHtml; heroTl.from('.gsap-char', { opacity: 0, scale: 1.6, rotationX: -90, duration: 0.6, stagger: 0.025, ease: 'back.out(1.4)' }, 0.6); }
heroTl.from('.hero-title .sub', { y: 30, opacity: 0, duration: 0.8 }, 1.8);

setTimeout(() => {
  gsap.utils.toArray('.section-title').forEach((el) => { ScrollTrigger.create({ trigger: el.closest('.g'), start: 'top 80%', onEnter: () => { gsap.fromTo(el, { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'power2.out' }); }, once: true }); });
  gsap.utils.toArray('.info-item').forEach((el, i) => { gsap.fromTo(el, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, delay: i*0.08, ease: 'power2.out' }); });
  gsap.from('.desc-box', { scrollTrigger: { trigger: '.desc-box', start: 'top 80%' }, y: 20, opacity: 0, duration: 0.6, ease: 'power2.out' });
  gsap.utils.toArray('.rel-item').forEach((el, i) => { ScrollTrigger.create({ trigger: el.closest('.related-grid'), start: 'top 75%', onEnter: () => { gsap.fromTo(el, { x: i%2===0?-20:20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, delay: i*0.06, ease: 'power2.out' }); }, once: true }); });
  gsap.utils.toArray('[onclick*="history.back"]').forEach(el => { gsap.from(el, { opacity: 0, y: 10, duration: 0.5, scrollTrigger: { trigger: el, start: 'top 90%' } }); });
}, 200);

const symbols = ['◇', '◈', '▸', '✦', '✧']; const floatContainer = document.createElement('div'); floatContainer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:93;overflow:hidden'; document.body.appendChild(floatContainer); for (let i = 0; i < 8; i++) { const sym = document.createElement('span'); sym.textContent = symbols[i % symbols.length]; sym.style.cssText = `position:absolute;color:rgba(255,215,0,0.10);font-size:${12+Math.random()*14}px;font-family:serif;`; sym.style.left = Math.random() * 100 + '%'; sym.style.top = Math.random() * 100 + '%'; floatContainer.appendChild(sym); gsap.to(sym, { y: -60-Math.random()*100, x: (Math.random()-0.5)*80, opacity: 0, rotation: (Math.random()-0.5)*360, duration: 6+Math.random()*8, repeat: -1, delay: Math.random()*10, ease: 'none' }); }
</script>
